<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="LLM 评测台 · ZCode Labs FDE 工作台矩阵">
<meta property="og:description" content="新模型强不强，用数据说话不拍脑袋">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wuxiumu.github.io/zcode-workbench/workbenches/llm-eval/">
<title>LLM 评测台 · Model Eval Lab | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>/* CDN 三级回退：国内镜像 → unpkg → cdnjs；全部失败则 stub 兜底保住数据面板 */window.echarts||document.write("<script src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'><\/script>")</script>
<script>window.echarts||(window.echarts={init:el=>{try{el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8494b8;font-size:12px">📉 图表库加载失败 · 文字数据面板不受影响</div>'}catch(e){}return{setOption(){},getOption(){return{}},resize(){}}}})</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zwb-theme')||'dark'}catch(e){}</script>
<script src="../../assets/perf-guard.js"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
:root{--acc:#4f8cff;--purple:#a78bfa;--cyan:#22d3ee;--glow:#301a3a;--acc-soft:rgba(79,140,255,.1);--ok-soft:rgba(52,211,153,.1);--warn-soft:rgba(251,191,36,.1);--warn-line:rgba(251,191,36,.3);--bad-soft:rgba(248,113,113,.1);}
[data-theme="light"]{--acc:#2f6cff;--purple:#7c3aed;--cyan:#0891b2;--glow:#f1e3f4;--acc-soft:rgba(47,108,255,.09);--ok-soft:rgba(14,159,110,.1);--warn-soft:rgba(217,119,6,.1);--warn-line:rgba(217,119,6,.35);--bad-soft:rgba(220,38,38,.08);}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 85% -10%,var(--glow) 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-right:56px}
.top h1{font-size:20px;display:flex;align-items:center;gap:10px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.pill{font-size:12px;color:var(--sub);background:var(--p1);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.pill b{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:.06em}
.panel h3 .chip{float:right;font-size:11px;letter-spacing:0;color:var(--sub)}
.chart{height:220px}.chart-lg{height:300px}.wide{grid-column:1/-1}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);letter-spacing:.05em;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--split);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px}
.badge i{width:5px;height:5px;border-radius:50%}
.st-ok{color:var(--ok);background:var(--ok-soft)}.st-ok i{background:var(--ok)}
.st-warn{color:var(--warn);background:var(--warn-soft)}.st-warn i{background:var(--warn)}
.st-bad{color:var(--bad);background:var(--bad-soft)}.st-bad i{background:var(--bad)}
.st-info{color:var(--acc);background:var(--acc-soft)}.st-info i{background:var(--acc)}
.trend{font-size:11px}.trend.up{color:var(--ok)}.trend.dn{color:var(--bad)}
.theme-btn{position:fixed;right:16px;top:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:scale(1.1);border-color:var(--acc)}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:99px;padding:3px 12px;letter-spacing:.1em}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换亮 / 暗主题" aria-label="切换亮 / 暗主题"></button>
<div class="top">
  <h1><span class="dot"></span>LLM 评测台 <span>MODEL EVAL LAB · eval-suite v3 · 回归+人工双通道 ｜ 新模型强不强，用数据说话不拍脑袋</span></h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="clock" id="clock"></span>
    <span class="pill">数据更新：<b>实时模拟</b> · 每 3.5 秒刷新</span>
  </div>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h3>四模型横评雷达 · 五维度</h3><div class="chart-lg" id="c-radar"></div></div>
  <div class="panel"><h3>回归集通过率 · 目标 ≥ 90%</h3><div class="chart-lg" id="c-pass"></div></div>
  <div class="panel wide"><h3>四模型三指标横评（准确率 / P95 延迟 / 单次成本）</h3><div class="chart" id="c-metrics"></div></div>
  <div class="panel"><h3>回归集通过率趋势（近 14 天）</h3><div class="chart" id="c-trend14"></div></div>
  <div class="panel"><h3>人工偏好对齐投票（blind A/B）</h3><div class="chart" id="c-vote"></div></div>
  <div class="panel wide"><h3>Badcase 流水 · 本周<span class="chip" id="bcChip"></span></h3><div class="tscroll"><table id="badcase"></table></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.round(rnd(a,b));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const last=a=>a[a.length-1];
const d14=Array.from({length:14},(_,i)=>{const d=new Date(Date.now()-(13-i)*864e5);return (d.getMonth()+1)+'/'+d.getDate()});

// 参评模型与主题色（c 存 CSS 变量名，渲染时经 V() 取当前主题色值）
const MODELS=[
  {n:'kimi-k2',c:'--acc'},
  {n:'deepseek-v3',c:'--purple'},
  {n:'qwen-max',c:'--cyan'},
  {n:'gpt-4o',c:'--warn'}];

// 回归集通过率（近 14 天，KPI 整体通过率与 gauge 引用其最新均值）
let pK=d14.map(()=>+rnd(90,95).toFixed(1)),pD=d14.map(()=>+rnd(91,96).toFixed(1)),
    pQ=d14.map(()=>+rnd(88,94).toFixed(1)),pG=d14.map(()=>+rnd(92,97).toFixed(1));
const passMean=()=>+((last(pK)+last(pD)+last(pQ)+last(pG))/4).toFixed(1);

// 雷达横评（五维度：准确率/指令遵循/推理/代码/中文写作）
let rdata=[
  [92.4,94.1,89.6,90.2,95.8],
  [93.8,91.2,92.5,93.4,90.6],
  [91.6,92.8,88.4,88.9,93.2],
  [94.2,93.5,91.8,92.6,88.7]];

// KPI · 评测总览
let cases=1286,bcN=17;
function renderKpis(){
  cases=clamp(cases+irnd(-2,4),1250,1340);
  if(Math.random()<.25)bcN++;
  const pm=passMean(),pmOk=pm>=90;
  const k=[
    ['参评模型数',4,' 个','up','+1 本周接入 qwen-max'],
    ['回归集用例',cases.toLocaleString(),' 条','up','+24 本周扩充'],
    ['本周新增 Badcase',bcN,' 条','dn','▲5 需复核'],
    ['整体通过率',pm,' %',pmOk?'up':'dn',pmOk?'目标 90% · 达标':'低于目标 90% 需回归']];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="trend ${x[3]}">${x[4]}</div></div>`).join('');
}

// 四模型横评雷达
const radarC=echarts.init(document.getElementById('c-radar'));
function renderRadar(){
  rdata=rdata.map(arr=>arr.map(v=>+clamp(v+rnd(-.3,.3),80,99).toFixed(1)));
  radarC.setOption({tooltip:{},legend:{data:MODELS.map(m=>m.n),textStyle:{color:V('--sub'),fontSize:10},top:0,itemWidth:10,itemHeight:10},
    radar:{indicator:[{name:'准确率',max:100},{name:'指令遵循',max:100},{name:'推理',max:100},{name:'代码',max:100},{name:'中文写作',max:100}],
      radius:'62%',center:['50%','54%'],axisName:{color:V('--sub'),fontSize:10},
      splitLine:{lineStyle:{color:V('--line')}},splitArea:{show:false},axisLine:{lineStyle:{color:V('--line')}}},
    series:[{type:'radar',data:rdata.map((arr,i)=>({value:arr,name:MODELS[i].n,
      lineStyle:{width:2,color:V(MODELS[i].c)},itemStyle:{color:V(MODELS[i].c)},areaStyle:{color:V(MODELS[i].c)+'22'}}))}]});
}

// 通过率 gauge（目标 90%）
const passC=echarts.init(document.getElementById('c-pass'));
function renderPass(){
  passC.setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:100,splitNumber:5,center:['50%','56%'],radius:'95%',
    axisLine:{lineStyle:{width:12,color:[[.8,V('--bad')],[.9,V('--warn')],[1,V('--ok')]]}},
    pointer:{length:'58%',width:4,itemStyle:{color:V('--txt')}},
    axisTick:{distance:-12,length:4,lineStyle:{color:V('--p2'),width:1}},
    splitLine:{distance:-14,length:12,lineStyle:{color:V('--p2'),width:2}},
    axisLabel:{distance:14,color:V('--sub'),fontSize:9},
    detail:{valueAnimation:true,formatter:'{value}%',color:V('--txt'),fontSize:24,fontWeight:700,offsetCenter:[0,'58%']},
    title:{offsetCenter:[0,'92%'],color:V('--sub'),fontSize:11},
    data:[{value:passMean(),name:'回归集通过率 · 目标 ≥ 90%'}]}]});
}

// 四模型三指标分组柱状图（准确率 % / P95 延迟 ms / 单次成本 分）
const metC=echarts.init(document.getElementById('c-metrics'));
let metLat=[1420,1680,1180,2340],metCost=[3.2,4.6,2.8,12.5];
function renderMetrics(){
  metLat=metLat.map(v=>clamp(v+irnd(-30,30),900,2800));
  metCost=metCost.map(v=>+clamp(v+rnd(-.2,.2),1.5,15).toFixed(1));
  const acc=rdata.map(a=>a[0]);
  metC.setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},legend:{textStyle:{color:V('--sub'),fontSize:11},top:0},
    grid:{left:44,right:92,top:34,bottom:26},
    xAxis:{type:'category',data:MODELS.map(m=>m.n),axisLabel:{color:V('--sub'),fontSize:10}},
    yAxis:[
      {name:'%',type:'value',min:80,max:100,nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
      {name:'ms',type:'value',min:0,max:3000,nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{show:false},axisLabel:{color:V('--sub'),fontSize:10}},
      {name:'分',type:'value',min:0,max:15,position:'right',offset:34,axisLine:{show:false},nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{show:false},axisLabel:{color:V('--sub'),fontSize:10}}],
    series:[
      {name:'准确率 %',type:'bar',data:acc,barWidth:14,itemStyle:{borderRadius:[3,3,0,0],color:V('--acc')}},
      {name:'P95 延迟 ms',type:'bar',yAxisIndex:1,data:metLat,barWidth:14,itemStyle:{borderRadius:[3,3,0,0],color:V('--cyan')}},
      {name:'单次成本 分',type:'bar',yAxisIndex:2,data:metCost,barWidth:14,itemStyle:{borderRadius:[3,3,0,0],color:V('--warn')}}]});
}

// 回归集通过率近 14 天趋势（四条线）
const t14C=echarts.init(document.getElementById('c-trend14'));
const PASSARR=[pK,pD,pQ,pG];
function renderT14(){
  t14C.setOption({tooltip:{trigger:'axis'},legend:{data:MODELS.map(m=>m.n),textStyle:{color:V('--sub'),fontSize:9},top:0,itemWidth:9,itemHeight:9},
    grid:{left:34,right:12,top:28,bottom:24},
    xAxis:{type:'category',data:d14,axisLabel:{color:V('--sub'),fontSize:9,interval:3}},
    yAxis:{min:80,max:100,type:'value',splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
    series:MODELS.map((m,i)=>({name:m.n,type:'line',data:PASSARR[i],smooth:true,showSymbol:false,lineStyle:{width:1.8,color:V(m.c)}}))});
}

// 人工偏好对齐投票（横向条形图 + 百分比）
const voteC=echarts.init(document.getElementById('c-vote'));
let voteV=[3284,2972,2451,1928];
function renderVote(){
  voteV=voteV.map(v=>Math.max(500,v+irnd(-40,60)));
  const total=voteV.reduce((a,b)=>a+b,0);
  const pairs=MODELS.map((m,i)=>({n:m.n,k:m.c,v:voteV[i],p:voteV[i]/total*100})).sort((a,b)=>b.v-a.v);
  voteC.setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>`${ps[0].name}　<b>${pairs[ps[0].dataIndex].v.toLocaleString()}</b> 票（${pairs[ps[0].dataIndex].p.toFixed(1)}%）`},
    grid:{left:96,right:100,top:10,bottom:10},
    xAxis:{type:'value',show:false,max:v=>Math.round(v.max*1.15)},
    yAxis:{type:'category',inverse:true,data:pairs.map(p=>p.n),axisLabel:{color:V('--sub'),fontSize:10},axisLine:{show:false},axisTick:{show:false}},
    series:[{type:'bar',barWidth:12,data:pairs.map(p=>({value:p.v,itemStyle:{borderRadius:[0,3,3,0],color:V(p.k)}})),
      label:{show:true,position:'right',fontSize:9,color:V('--sub'),
        formatter:p=>`${pairs[p.dataIndex].p.toFixed(1)}% · ${pairs[p.dataIndex].v.toLocaleString()} 票`}}]});
}

// Badcase 流水（模型/类别/严重度徽标/问题摘要）
const SEV={P0:['st-bad','严重'],P1:['st-warn','一般'],P2:['st-info','轻微']},SEVORD={P0:0,P1:1,P2:2},STC={待复核:'var(--warn)',修复中:'var(--acc)',已修复:'var(--ok)'};
let badcases=[
  {m:'kimi-k2',cat:'指令遵循',sev:'P0',desc:'多轮对话中忽略「不要使用列表」的格式约束',st:'待复核'},
  {m:'gpt-4o',cat:'中文写作',sev:'P1',desc:'成语误用：「首当其冲」错作「首先」理解',st:'待复核'},
  {m:'deepseek-v3',cat:'代码',sev:'P0',desc:'SQL 防注入示例中残留字符串拼接漏洞',st:'修复中'},
  {m:'kimi-k2',cat:'准确性',sev:'P1',desc:'奥运奖牌数回答引用过期数据（幻觉）',st:'待复核'},
  {m:'qwen-max',cat:'推理',sev:'P1',desc:'多步数学应用题在第 3 步假设错误',st:'已修复'},
  {m:'gpt-4o',cat:'推理',sev:'P0',desc:'「红蓝帽子」逻辑题解法遗漏约束条件',st:'待复核'},
  {m:'deepseek-v3',cat:'准确性',sev:'P2',desc:'单位换算四舍五入误差 0.1',st:'已修复'},
  {m:'qwen-max',cat:'指令遵循',sev:'P2',desc:'JSON 输出末尾多余解释文字',st:'已修复'}];
function renderBadcase(){
  const rows=[...badcases].sort((a,b)=>SEVORD[a.sev]-SEVORD[b.sev]);
  const cnt=s=>badcases.filter(b=>b.sev===s).length;
  document.getElementById('bcChip').textContent=`P0 ${cnt('P0')} · P1 ${cnt('P1')} · P2 ${cnt('P2')}`;
  document.getElementById('badcase').innerHTML='<tr><th>模型</th><th>类别</th><th>严重度</th><th>问题摘要</th><th>状态</th></tr>'+
    rows.map(b=>`<tr><td>${b.m}</td><td>${b.cat}</td><td><span class="badge ${SEV[b.sev][0]}"><i></i>${b.sev} ${SEV[b.sev][1]}</span></td><td>${b.desc}</td><td style="color:${STC[b.st]}">${b.st}</td></tr>`).join('');
}

// 时钟
const tickClock=()=>{document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})};

// 主题切换：图表按当前 CSS 变量重建
function retheme(){renderRadar();renderPass();renderMetrics();renderT14();renderVote();}
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zwb-theme',t)}catch(e){}themeBtn.textContent=t==='light'?'🌙':'☀️';retheme();}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
themeBtn.textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️';

// 模拟实时
function tick(){
  pK.shift();pK.push(+rnd(90,95).toFixed(1));
  pD.shift();pD.push(+rnd(91,96).toFixed(1));
  pQ.shift();pQ.push(+rnd(88,94).toFixed(1));
  pG.shift();pG.push(+rnd(92,97).toFixed(1));
  renderKpis();renderRadar();renderPass();renderMetrics();renderT14();renderVote();renderBadcase();
}
renderKpis();renderRadar();renderPass();renderMetrics();renderT14();renderVote();renderBadcase();
tickClock();setInterval(tickClock,1000);
setInterval(tick,3500);
window.addEventListener('resize',()=>[radarC,passC,metC,t14C,voteC].forEach(c=>c.resize()));
</script>

<script>
window.AI_ASSISTANT={
  title:'LLM 评测台',subtitle:'MODEL EVAL LAB',
  insights(){var pm=passMean();
    var p0=badcases.filter(function(b){return b.sev==='P0'});
    var best=0;for(var i=1;i<4;i++){var s=0,s2=0;for(var j=0;j<5;j++){s+=rdata[best][j];s2+=rdata[i][j]}if(s2>s)best=i}
    var leader=voteV.indexOf(Math.max.apply(null,voteV));
    return [
      {tag:'通过率',lv:pm>=90?'ok':'warn',text:'回归集整体通过率 '+pm+'%'+(pm>=90?'，达到 90% 目标。':'，低于 90% 目标，建议针对失败用例做专项回归。')},
      {tag:'Badcase',lv:p0.length?'bad':'ok',text:p0.length?('本周 P0 级 '+p0.length+' 条：'+p0[0].desc+'。'):'本周无 P0 级 Badcase。'},
      {tag:'横评',lv:'info',text:'五维综合最优为 '+MODELS[best].n+'（均值 '+(rdata[best].reduce(function(a,b){return a+b},0)/5).toFixed(1)+'），中文写作维度 kimi-k2 领先。'},
      {tag:'偏好',lv:'info',text:'人工盲测 '+MODELS[leader].n+' 得票最高（'+Math.max.apply(null,voteV).toLocaleString()+' 票）。'}
    ];},
  advice(){return ['把 P0 Badcase 固化为回归用例，防止同类问题复发。','对 gpt-4o 高成本调用场景做蒸馏小模型替代评估。'];},
  alerts(){var p0=badcases.filter(function(b){return b.sev==='P0'})[0];
    return p0?{lv:'bad',text:'🔴 P0 Badcase：'+p0.desc+'（'+p0.m+'）'}:null;}
};
</script>
<script src="../../assets/ai-assistant/ai-assistant.js" defer></script>
<script src="../../assets/export-tools.js" defer></script>
</body>
</html>
