<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="财务经营驾驶舱 · ZCode Labs FDE 工作台矩阵">
<meta property="og:description" content="现金还能撑几周，什么时候该踩刹车">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wuxiumu.github.io/zcode-workbench/workbenches/finance-cockpit/">
<title>财务经营驾驶舱 · Finance Cockpit | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>/* CDN 三级回退：国内镜像 → unpkg → cdnjs；全部失败则 stub 兜底保住数据面板 */window.echarts||document.write("<script src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'><\/script>")</script>
<script>window.echarts||(window.echarts={init:el=>{try{el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8494b8;font-size:12px">📉 图表库加载失败 · 文字数据面板不受影响</div>'}catch(e){}return{setOption(){},getOption(){return{}},resize(){}}}})</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zwb-theme')||'dark'}catch(e){}</script>
<script src="../../assets/perf-guard.js"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
:root{--acc:#4f8cff;--cyan:#22d3ee;--glow:#2a1b45;--acc-deep:#1d3a8f;--warn-soft:rgba(251,191,36,.08);--warn-line:rgba(251,191,36,.3);}
[data-theme="light"]{--acc:#2f6cff;--cyan:#0891b2;--glow:#ece4f7;--acc-deep:#9db9f7;--warn-soft:rgba(217,119,6,.1);--warn-line:rgba(217,119,6,.35);}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 85% -10%,var(--glow) 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-right:56px}
.top h1{font-size:20px;display:flex;align-items:center;gap:10px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.pill{font-size:12px;color:var(--sub);background:var(--p1);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.pill b{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:.06em}
.panel h3 .chip{float:right;font-size:11px;letter-spacing:0;color:var(--sub)}
.chart{height:220px}.wide{grid-column:1/-1}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .8s}
.trend{font-size:11px}.trend.up{color:var(--ok)}.trend.dn{color:var(--bad)}
.theme-btn{position:fixed;right:16px;top:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:scale(1.1);border-color:var(--acc)}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:99px;padding:3px 12px;letter-spacing:.1em}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换亮 / 暗主题" aria-label="切换亮 / 暗主题"></button>
<div class="top">
  <h1><span class="dot"></span>财务经营驾驶舱 <span>FINANCE COCKPIT · FY2026 · 11 月账期 ｜ 现金还能撑几周，什么时候该踩刹车</span></h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="clock" id="clock"></span>
    <span class="pill">数据更新：<b>实时模拟</b> · 每 3.5 秒刷新</span>
  </div>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel wide"><h3>近 12 个月收入-成本-利润组合（万元）</h3><div class="chart" id="c-m12"></div></div>
  <div class="panel wide"><h3>现金流 13 周预测水位<span class="chip" id="cashChip"></span></h3><div class="chart" id="c-cash"></div></div>
  <div class="panel"><h3>净利率 · 目标 ≥ 15%</h3><div class="chart" id="c-npm"></div></div>
  <div class="panel"><h3>应收账款账龄分布<span class="chip" id="arChip" style="color:var(--acc)"></span></h3><div class="chart" id="c-ar"></div></div>
  <div class="panel"><h3>费用结构瀑布（本月损益 · 万元）</h3><div class="chart" id="c-wf"></div></div>
  <div class="panel"><h3>预算执行率 · 按部门（月度 · 万元）<span class="chip">月度预算</span></h3><div id="budget"></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.round(rnd(a,b));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const weeks=Array.from({length:13},(_,i)=>{const d=new Date(Date.now()+i*7*864e5);return (d.getMonth()+1)+'/'+d.getDate()});
const months=Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(11-i));return (d.getFullYear()%100)+'/'+String(d.getMonth()+1).padStart(2,'0')});

// KPI · 四大经营指标（毛利/净利/费用保持勾稽一致：费用 = 毛利 - 净利）
let rev=1286,gpRate=.412,npRate=.17,gp,np,exp;
function renderKpis(){
  rev=clamp(rev+irnd(-12,18),1180,1420);
  gpRate=clamp(gpRate+rnd(-.004,.004),.38,.44);
  npRate=clamp(npRate+rnd(-.005,.005),.132,.198);
  gp=Math.round(rev*gpRate);np=Math.round(rev*npRate);exp=gp-np;
  const npOk=npRate>=.15;
  const k=[
    ['本月营收','¥'+rev.toLocaleString(),' 万','up','+8.6% 环比上月'],
    ['本月毛利','¥'+gp.toLocaleString(),' 万','up','毛利率 '+(gpRate*100).toFixed(1)+'% · +1.1pt'],
    ['本月净利','¥'+np.toLocaleString(),' 万',npOk?'up':'dn','净利率 '+(npRate*100).toFixed(1)+'% · '+(npOk?'达标':'低于目标')],
    ['费用合计','¥'+exp.toLocaleString(),' 万','dn','▲4.2% 费效比需关注']];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="trend ${x[3]}">${x[4]}</div></div>`).join('');
}

// 近 12 个月收入-成本-利润组合
const m12C=echarts.init(document.getElementById('c-m12'));
let mRev=months.map((_,i)=>Math.round(1120+i*14+rnd(-55,55)));
let mCost=mRev.map(v=>Math.round(v*rnd(.55,.62)));
let mProf=mRev.map(v=>Math.round(v*rnd(.14,.20)));
function renderM12(){
  m12C.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:V('--sub'),fontSize:11},top:0},
    grid:{left:44,right:14,top:34,bottom:26},
    xAxis:{type:'category',data:months,axisLabel:{color:V('--sub'),fontSize:10}},
    yAxis:{name:'万元',type:'value',nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
    series:[
      {name:'营收',type:'bar',data:mRev,barWidth:10,itemStyle:{borderRadius:[3,3,0,0],color:V('--acc')}},
      {name:'营业成本',type:'bar',data:mCost,barWidth:10,itemStyle:{borderRadius:[3,3,0,0],color:V('--bad')+'b3'}},
      {name:'净利润',type:'line',data:mProf,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--ok')},areaStyle:{color:V('--ok')+'22'}}]});
}

// 现金流 13 周预测水位（带安全线）
const SAFE=2500;
const cashC=echarts.init(document.getElementById('c-cash'));
let cash=[4210,3980,3650,3320,3040,2760,2420,2560,2900,3250,3560,3900,4180];
function renderCash(){
  cash=cash.map(v=>clamp(v+irnd(-60,60),1800,4800));
  cashC.setOption({tooltip:{trigger:'axis',formatter:ps=>`${ps[0].name} <b>¥${ps[0].value}</b> 万`},
    grid:{left:44,right:14,top:26,bottom:26},
    xAxis:{type:'category',data:weeks,axisLabel:{color:V('--sub'),fontSize:10}},
    yAxis:{name:'万元',type:'value',nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
    series:[{name:'现金余额',type:'bar',barWidth:16,data:cash.map(v=>({value:v,itemStyle:{borderRadius:[3,3,0,0],color:v<SAFE?V('--bad'):{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:V('--acc')},{offset:1,color:V('--acc-deep')}]}}})),
      markLine:{silent:true,symbol:'none',data:[{yAxis:SAFE}],lineStyle:{color:V('--warn'),type:'dashed',width:1.5},label:{formatter:'安全水位 ¥2,500 万',color:V('--warn'),fontSize:10,position:'insideEndTop'}}}]});
  const chip=document.getElementById('cashChip');
  chip.textContent='当前现金 ¥'+cash[0].toLocaleString()+' 万';
  chip.style.color=cash[0]>=SAFE?'var(--ok)':'var(--bad)';
}

// 净利率 gauge（目标 15%）
const npmC=echarts.init(document.getElementById('c-npm'));
function renderNpm(){
  npmC.setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:30,splitNumber:6,center:['50%','56%'],radius:'95%',
    axisLine:{lineStyle:{width:12,color:[[1/3,V('--bad')],[.5,V('--warn')],[1,V('--ok')]]}},
    pointer:{length:'58%',width:4,itemStyle:{color:V('--txt')}},
    axisTick:{distance:-12,length:4,lineStyle:{color:V('--p2'),width:1}},
    splitLine:{distance:-14,length:12,lineStyle:{color:V('--p2'),width:2}},
    axisLabel:{distance:14,color:V('--sub'),fontSize:9,formatter:'{value}%'},
    detail:{valueAnimation:true,formatter:'{value}%',color:V('--txt'),fontSize:22,fontWeight:700,offsetCenter:[0,'58%']},
    title:{offsetCenter:[0,'92%'],color:V('--sub'),fontSize:11},
    data:[{value:+(npRate*100).toFixed(1),name:'本月净利率 · 目标 ≥ 15%'}]}]});
}

// 应收账款账龄分布
const arC=echarts.init(document.getElementById('c-ar'));
const ARNAME=['0-30 天','31-60 天','61-90 天','90+ 天'],ARKEY=['--ok','--acc','--warn','--bad'];
let arData=[1246,516,236,150];
function renderAr(){
  arData=arData.map(v=>Math.max(40,v+irnd(-8,8)));
  arC.setOption({tooltip:{trigger:'item',formatter:'{b}: ¥{c} 万 ({d}%)'},legend:{bottom:0,textStyle:{color:V('--sub'),fontSize:10},itemWidth:10,itemHeight:10},
    series:[{type:'pie',radius:['42%','66%'],center:['50%','40%'],itemStyle:{borderColor:V('--p2'),borderWidth:2},label:{show:false},
      data:ARNAME.map((n,i)=>({name:n,value:arData[i],itemStyle:{color:V(ARKEY[i])}}))}]});
  document.getElementById('arChip').textContent='应收总额 ¥'+arData.reduce((a,b)=>a+b,0).toLocaleString()+' 万';
}

// 费用结构瀑布（本月损益：营收 → 成本 → 三项费用 → 净利）
const wfC=echarts.init(document.getElementById('c-wf'));
function renderWf(){
  const cost=rev-gp,sales=Math.round(exp*.42),rd=Math.round(exp*.34),adm=exp-sales-rd;
  const cats=['营收','营业成本','毛利','销售费用','研发费用','管理费用','净利'];
  const base=[0,gp,0,gp-sales,gp-sales-rd,np,0];
  const vis=[[rev,V('--acc')],[cost,V('--bad')],[gp,V('--ok')],[sales,V('--warn')],[rd,V('--warn')],[adm,V('--warn')],[np,V('--cyan')]];
  wfC.setOption({tooltip:{trigger:'axis',formatter:ps=>ps.filter(p=>p.seriesName!=='base').map(p=>`${p.marker}${p.name}　<b>¥${p.value}</b> 万`).join('<br>')},
    grid:{left:52,right:10,top:22,bottom:24},
    xAxis:{type:'category',data:cats,axisLabel:{color:V('--sub'),fontSize:10}},
    yAxis:{name:'万元',type:'value',nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
    series:[
      {name:'base',type:'bar',stack:'wf',barWidth:20,data:base,itemStyle:{color:'transparent'},emphasis:{itemStyle:{color:'transparent'}}},
      {name:'金额',type:'bar',stack:'wf',barWidth:20,label:{show:true,position:'top',fontSize:9,color:V('--txt'),formatter:p=>p.value},
        data:vis.map(v=>({value:v[0],itemStyle:{borderRadius:[3,3,0,0],color:v[1]}}))}]});
}

// 预算执行率 · 按部门
const depts=[
  {d:'研发部',used:102,budget:118},
  {d:'销售部',used:89,budget:112},
  {d:'市场部',used:42,budget:56},
  {d:'供应链部',used:38,budget:52},
  {d:'行政部',used:23,budget:38},
  {d:'人力资源部',used:12,budget:26}];
function renderBudget(){
  depts.forEach(b=>{b.used=Math.min(b.budget-2,b.used+irnd(-3,4))});
  document.getElementById('budget').innerHTML=depts.map(b=>{const r=b.used/b.budget*100;
    const c=r>=95?'var(--bad)':r>=70?'var(--ok)':'var(--warn)';
    return `<div style="margin:10px 2px;font-size:12px"><div style="display:flex;justify-content:space-between"><span>${b.d}</span><span style="color:${c};font-variant-numeric:tabular-nums">${r.toFixed(0)}% · ¥${b.used} / ¥${b.budget} 万</span></div><div class="bar"><i style="width:${Math.min(100,r)}%;background:${c}"></i></div></div>`}).join('');
}

// 时钟
const tickClock=()=>{document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})};

// 主题切换：图表按当前 CSS 变量重建
function retheme(){renderNpm();renderM12();renderCash();renderAr();renderWf();}
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zwb-theme',t)}catch(e){}themeBtn.textContent=t==='light'?'🌙':'☀️';retheme();}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
themeBtn.textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️';

// 模拟实时
function tick(){
  mRev.shift();mRev.push(Math.round(1240+rnd(-40,90)));
  mCost.shift();mCost.push(Math.round(mRev[11]*rnd(.55,.62)));
  mProf.shift();mProf.push(Math.round(mRev[11]*rnd(.14,.20)));
  renderKpis();renderNpm();renderM12();renderCash();renderAr();renderWf();renderBudget();
}
renderKpis();renderNpm();renderM12();renderCash();renderAr();renderWf();renderBudget();
tickClock();setInterval(tickClock,1000);
setInterval(tick,3500);
window.addEventListener('resize',()=>[m12C,cashC,npmC,arC,wfC].forEach(c=>c.resize()));
</script>

<script>
window.AI_ASSISTANT={
  title:'财务经营驾驶舱',subtitle:'FINANCE COCKPIT',
  insights(){var cashNow=cash[0],arSum=arData.reduce(function(a,b){return a+b},0);
    var ar90=(arData[3]/arSum*100).toFixed(1);
    var rd=depts[0];
    return [
      {tag:'营收',lv:'ok',text:'本月营收 ¥'+rev.toLocaleString()+' 万，环比 +8.6%，毛利率 '+(gpRate*100).toFixed(1)+'%。'},
      {tag:'净利率',lv:npRate>=.15?'ok':'warn',text:'净利率 '+(npRate*100).toFixed(1)+'%'+(npRate>=.15?'，达到 15% 目标线。':'，低于 15% 目标线，费用端需收缩。')},
      {tag:'现金流',lv:cashNow>=SAFE?'ok':'bad',text:'当前现金 ¥'+cashNow.toLocaleString()+' 万，'+(cashNow>=SAFE?'高于 ¥2,500 万安全水位。':'已跌破 ¥2,500 万安全水位，请启动资金预案！')},
      {tag:'应收',lv:arData[3]/arSum>0.12?'warn':'ok',text:'90+ 天账龄占比 '+ar90+'%'+(arData[3]/arSum>0.12?'，偏高，建议法务介入催收。':'，账龄结构健康。')},
      {tag:'预算',lv:rd.used/rd.budget>0.9?'warn':'ok',text:'研发部预算已执行 '+(rd.used/rd.budget*100).toFixed(0)+'%，'+(rd.used/rd.budget>0.9?'月末前大概率超支。':'节奏正常。')}
    ];},
  advice(){return ['对 90+ 天应收逐户制定回款计划，纳入销售绩效。','净利率若连续两周低于 15%，冻结非核心岗位补录。'];},
  alerts(){return cash[0]<SAFE?{lv:'bad',text:'🔴 现金流 ¥'+cash[0].toLocaleString()+' 万，已跌破安全水位'}:Math.random()<.4?{lv:'info',text:'💡 11 月账期结账进度 68%'}:null;}
};
</script>
<script src="../../assets/ai-assistant/ai-assistant.js" defer></script>
<script src="../../assets/export-tools.js" defer></script>
</body>
</html>
