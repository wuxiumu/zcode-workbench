<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容运营台 · Content Ops | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>/* CDN 三级回退：国内镜像 → unpkg → cdnjs；全部失败则 stub 兜底保住数据面板 */window.echarts||document.write("<script src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'><\/script>")</script>
<script>window.echarts||(window.echarts={init:el=>{try{el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8494b8;font-size:12px">📉 图表库加载失败 · 文字数据面板不受影响</div>'}catch(e){}return{setOption(){},getOption(){return{}},resize(){}}}})</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zwb-theme')||'dark'}catch(e){}</script>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
:root{--acc:#4f8cff;--pink:#f472b6;--cyan:#22d3ee;--glow:#251234;--acc-deep:#1d3a8f;--ok-soft:rgba(52,211,153,.12);--cyan-soft:rgba(34,211,238,.12);--warn-soft:rgba(251,191,36,.12);--warn-line:rgba(251,191,36,.3);--bad-soft:rgba(248,113,113,.12);--pink-soft:rgba(244,114,182,.12);}
[data-theme="light"]{--acc:#2f6cff;--pink:#db2777;--cyan:#0891b2;--glow:#f0e3f7;--acc-deep:#9db9f7;--ok-soft:rgba(14,159,110,.1);--cyan-soft:rgba(8,145,178,.1);--warn-soft:rgba(217,119,6,.1);--warn-line:rgba(217,119,6,.35);--bad-soft:rgba(220,38,38,.08);--pink-soft:rgba(219,39,119,.1);}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 50% -10%,var(--glow) 0%,var(--bg) 62%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-right:56px}
.top h1{font-size:20px}.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.top a{color:var(--acc);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--p1)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px}
.kpi .d{font-size:11px;margin-top:4px}.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.chart{height:200px}.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--split)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px}
.badge i{width:5px;height:5px;border-radius:50%}
.st-ok{color:var(--ok);background:var(--ok-soft)}.st-ok i{background:var(--ok)}
.st-wait{color:var(--warn);background:var(--warn-soft)}.st-wait i{background:var(--warn)}
.st-bad{color:var(--bad);background:var(--bad-soft)}.st-bad i{background:var(--bad)}
.chip{font-size:11px;padding:2px 8px;border-radius:6px;margin-right:4px;display:inline-block}
.c-xhs{color:var(--pink);background:var(--pink-soft)}
.c-sph{color:var(--ok);background:var(--ok-soft)}
.c-dy{color:var(--cyan);background:var(--cyan-soft)}
.c-wb{color:var(--warn);background:var(--warn-soft)}
.flow{display:flex;align-items:center;gap:0;margin-top:6px}
.step{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:var(--p2);border:1px solid var(--line)}
.step .n{font-size:20px;font-weight:800}
.step .l{font-size:11px;color:var(--sub);margin-top:2px}
.arrow{color:var(--sub);padding:0 6px;font-size:14px}
.theme-btn{position:fixed;right:16px;top:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:scale(1.1);border-color:var(--acc)}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:99px;padding:3px 12px}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换亮 / 暗主题" aria-label="切换亮 / 暗主题"></button>
<div class="top">
  <h1>内容运营台 <span>CONTENT OPS · 素材任务一体化（联动 zcode-tast-cms） ｜ 素材卡在哪一步，清清楚楚</span></h1>
  <a href="https://github.com/wuxiumu/zcode-tast-cms" target="_blank">↗ 姊妹系统 zcode-tast-cms</a>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel wide">
    <h3>素材生命周期 · 今日流转</h3>
    <div class="flow" id="flow"></div>
  </div>
  <div class="panel"><h3>任务领取 → 发布 → 审核转化（近 14 天）</h3><div class="chart" id="c-conv"></div></div>
  <div class="panel"><h3>渠道标签分布</h3><div class="chart" id="c-chan"></div></div>
  <div class="panel"><h3>审核队列 · Review Queue</h3><table id="queue"></table></div>
  <div class="panel"><h3>奖励发放流水（今日）</h3><table id="reward"></table></div>
  <div class="panel"><h3>素材分类热度</h3><div class="chart" id="c-cat"></div></div>
  <div class="panel"><h3>内容数据达标率</h3><div class="chart" id="c-rate"></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const M=['小红书','视频号','抖音','微博'];
const chips={小红书:'c-xhs',视频号:'c-sph',抖音:'c-dy',微博:'c-wb'};
// 生命周期
const flowSteps=[['上架素材','128'],['被领取','342'],['已发布','287'],['审核通过','249'],['奖励结算','231']];
function renderFlow(){document.getElementById('flow').innerHTML=flowSteps.map((s,i)=>`<div class="step"><div class="n">${s[1]}</div><div class="l">${s[0]}</div></div>${i<flowSteps.length-1?'<div class="arrow">→</div>':''}`).join('')}
renderFlow();
// 转化趋势
const conv=echarts.init(document.getElementById('c-conv'));
const days=Array.from({length:14},(_,i)=>{const d=new Date(Date.now()-(13-i)*864e5);return (d.getMonth()+1)+'/'+d.getDate()});
const convData=[days.map(()=>Math.round(rnd(180,420))),days.map(()=>Math.round(rnd(140,320))),days.map(()=>Math.round(rnd(120,260)))];
function renderConv(){conv.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:V('--sub'),fontSize:10},top:0},grid:{left:36,right:12,top:30,bottom:24},xAxis:{type:'category',data:days,axisLabel:{color:V('--sub'),fontSize:9}},yAxis:{type:'value',splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},series:[{name:'领取',type:'line',smooth:true,data:convData[0],showSymbol:false,lineStyle:{width:2,color:V('--acc')}},{name:'发布',type:'line',smooth:true,data:convData[1],showSymbol:false,lineStyle:{width:2,color:V('--cyan')}},{name:'通过',type:'line',smooth:true,data:convData[2],showSymbol:false,lineStyle:{width:2,color:V('--ok')}}]})}
renderConv();
// 渠道（数据抽离为可变数组，支持实时刷新）
const chan=echarts.init(document.getElementById('c-chan'));
const CHAN_NAMES=['小红书','视频号','抖音','微博'];
const CHAN_COLORS=['--pink','--ok','--cyan','--warn'];
const chanData=[38,26,24,12];
function renderChan(){chan.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:V('--sub'),fontSize:10},itemWidth:10,itemHeight:10},series:[{type:'pie',radius:['42%','66%'],center:['50%','42%'],label:{show:false},itemStyle:{borderColor:V('--p2'),borderWidth:2},data:chanData.map((v,i)=>({value:v,name:CHAN_NAMES[i],itemStyle:{color:V(CHAN_COLORS[i])}}))}]})}
renderChan();
// 分类热度（数据抽离为可变数组）
const cat=echarts.init(document.getElementById('c-cat'));
const CAT_NAMES=['家居好物','职场效率','母婴育儿','数码科技','穿搭种草','美食探店'];
const catData=[86,120,154,178,231,264];
function renderCat(){cat.setOption({tooltip:{trigger:'axis'},grid:{left:70,right:30,top:10,bottom:24},xAxis:{type:'value',splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},yAxis:{type:'category',data:CAT_NAMES,axisLabel:{color:V('--sub'),fontSize:11}},series:[{type:'bar',data:catData,barWidth:14,itemStyle:{borderRadius:[0,4,4,0],color:{type:'linear',x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:V('--acc-deep')},{offset:1,color:V('--pink')}]}}}]})}
renderCat();
// 达标率仪表（可变数值）
const rate=echarts.init(document.getElementById('c-rate'));
let rateVal=72;
function renderRate(){rate.setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:100,radius:'92%',center:['50%','58%'],progress:{show:true,width:10,itemStyle:{color:V('--ok')}},axisLine:{lineStyle:{width:10,color:[[1,V('--track')]]}},axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},pointer:{show:false},anchor:{show:false},detail:{valueAnimation:true,fontSize:26,color:V('--txt'),formatter:'{value}%',offsetCenter:[0,'18%']},title:{show:true,offsetCenter:[0,'52%'],fontSize:11,color:V('--sub')},data:[{value:rateVal,name:'数据达标率(播放/点赞)'}]}]})}
renderRate();
// 审核队列
const queueData=[
  ['秋日风衣穿搭合集','小红书 · 穿搭种草','待审核','st-wait'],
  ['便携咖啡机开箱','视频号 · 数码科技','凭证模糊，已驳回','st-bad'],
  ['宝宝辅食 7 日计划','抖音 · 母婴育儿','待审核','st-wait'],
  ['桌面收纳 10 件套','小红书 · 家居好物','待审核','st-wait'],
  ['Citywalk 路线攻略','微博 · 美食探店','已通过','st-ok'],
  ['机械键盘打字音','B站 · 数码科技','已通过','st-ok'],
  ['露营炊具清单','视频号 · 家居好物','待审核','st-wait'],
];
document.getElementById('queue').innerHTML='<tr><th>素材任务</th><th>渠道 · 分类</th><th>状态</th></tr>'+queueData.map(q=>`<tr><td>${q[0]}</td><td>${q[1].split(' · ').map(x=>chips[x]?`<span class="chip ${chips[x]}">${x}</span>`:x).join(' ')}</td><td><span class="badge ${q[2]}"><i></i>${q[2]==='st-wait'?'待审核':q[2]==='st-bad'?'已驳回':'已通过'}</span></td></tr>`).join('');
// 奖励流水
const rwNames=['李**','王**','张**','陈**','刘**','赵**','孙**','周**'];
let rw=rwNames.map(n=>({n,amt:Math.round(rnd(5,60)),ch:M[Math.floor(Math.random()*4)]}));
function renderRw(){
  rw.forEach(r=>r.amt=Math.max(1,Math.round(r.amt+rnd(-3,4))));
  document.getElementById('reward').innerHTML='<tr><th>用户</th><th>渠道</th><th>奖励</th></tr>'+rw.map(r=>`<tr><td>${r.n}</td><td><span class="chip ${chips[r.ch]}">${r.ch}</span></td><td style="color:var(--ok)">+¥${r.amt}.00</td></tr>`).join('');
}
renderRw();
// KPI
function renderKpis(){
  const k=[['今日新增素材','12','up','+4 较昨日'],['任务领取','342','up','+18%'],['待审核','26','dn','积压 -6'],['今日奖励支出','¥'+(rw.reduce((a,r)=>a+r.amt,0)+860).toLocaleString()+'.00','up','发放 41 笔']];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="d ${x[2]}">${x[3]}</div></div>`).join('');
}
renderKpis();
// 主题切换：图表按当前 CSS 变量重建
function retheme(){renderConv();renderChan();renderCat();renderRate();}
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zwb-theme',t)}catch(e){}themeBtn.textContent=t==='light'?'🌙':'☀️';retheme();}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
themeBtn.textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️';
setInterval(()=>{
  convData.forEach((arr,i)=>{const rg=[[180,420],[140,320],[120,260]][i];arr.shift();arr.push(Math.round(rnd(rg[0],rg[1])))});
  chanData.forEach((v,i)=>chanData[i]=Math.max(4,Math.round(v*rnd(.96,1.05))));
  catData.forEach((v,i)=>catData[i]=Math.max(30,v+Math.round(rnd(-8,10))));
  rateVal=+Math.max(60,Math.min(85,rateVal+rnd(-1.2,1.4))).toFixed(0);
  renderConv();renderChan();renderCat();renderRate();
  renderRw();renderKpis();
},4200);
window.addEventListener('resize',()=>[conv,chan,cat,rate].forEach(c=>c.resize()));
</script>

<script>
window.AI_ASSISTANT={
  title:'内容运营台',subtitle:'CONTENT OPS',
  insights(){var claim=convData[0][convData[0].length-1],pass=convData[2][convData[2].length-1];
    var hot=catData.slice().sort(function(a,b){return b-a})[0],hi=catData.indexOf(hot);
    var reward=rw.reduce(function(a,r){return a+r.amt},0)+860;
    return [
      {tag:'转化',lv:'info',text:'近 14 天「领取→通过」转化约 '+(pass/claim*100).toFixed(0)+'%，审核通过节奏平稳。'},
      {tag:'达标率',lv:rateVal>=70?'ok':'warn',text:'数据达标率 '+rateVal+'%'+(rateVal>=70?'，内容质量整体合格。':'，低于 70% 基准，建议优化素材脚本。')},
      {tag:'热点',lv:'info',text:'「'+CAT_NAMES[hi]+'」分类热度最高（'+hot+'），可加大该类素材供给。'},
      {tag:'激励',lv:'ok',text:'今日奖励支出 ¥'+reward.toLocaleString()+'.00，发放 '+rw.length+'+ 笔，达人侧动性良好。'}
    ];},
  advice(){var hi=catData.indexOf(catData.slice().sort(function(a,b){return b-a})[0]);
    return ['围绕「'+CAT_NAMES[hi]+'」策划专题选题，承接当前热度。','对连续驳回的素材作者推送合规手册，降低审核损耗。'];},
  alerts(){var r=rw[Math.floor(Math.random()*rw.length)];
    return {lv:'info',text:'💰 奖励发放：'+r.n+' +¥'+r.amt+'.00（'+r.ch+'）'};}
};
</script>
<script src="../../assets/ai-assistant/ai-assistant.js" defer></script>
<script src="../../assets/export-tools.js" defer></script>
</body>
</html>
