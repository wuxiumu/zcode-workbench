<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>增长分析台 · Growth Analytics | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>/* CDN 三级回退：国内镜像 → unpkg → cdnjs；全部失败则 stub 兜底保住数据面板 */window.echarts||document.write("<script src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'><\/script>")</script>
<script>window.echarts||(window.echarts={init:el=>{try{el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8494b8;font-size:12px">📉 图表库加载失败 · 文字数据面板不受影响</div>'}catch(e){}return{setOption(){},getOption(){return{}},resize(){}}}})</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zwb-theme')||'dark'}catch(e){}</script>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
:root{--acc:#4f8cff;--sky:#38bdf8;--cyan:#22d3ee;--lime:#a3e635;--purple:#a78bfa;--pink:#f472b6;--glow:#1a1436;--acc-deep:#1d3a8f;--warn-soft:rgba(251,191,36,.08);--warn-line:rgba(251,191,36,.3);}
[data-theme="light"]{--acc:#2f6cff;--sky:#0284c7;--cyan:#0891b2;--lime:#65a30d;--purple:#7c3aed;--pink:#db2777;--glow:#e9e4f8;--acc-deep:#9db9f7;--warn-soft:rgba(217,119,6,.1);--warn-line:rgba(217,119,6,.35);}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 15% -10%,var(--glow) 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-right:56px}
.top h1{font-size:20px}.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.pill{font-size:12px;color:var(--sub);background:var(--p1);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.pill b{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.chart{height:220px}.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--split);font-variant-numeric:tabular-nums}
.rank{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;background:var(--track);color:var(--sub)}
.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1206;font-weight:700}
.r2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#1a1206;font-weight:700}
.r3{background:linear-gradient(135deg,#f59e0b99,#b4530999);color:#fff;font-weight:700}
.trend{font-size:11px}.trend.up{color:var(--ok)}.trend.dn{color:var(--bad)}
.theme-btn{position:fixed;right:16px;top:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:scale(1.1);border-color:var(--acc)}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:99px;padding:3px 12px}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换亮 / 暗主题"></button>
<div class="top">
  <h1>增长分析台 <span>GROWTH ANALYTICS · 近 30 天 ｜ 钱从哪个渠道赚来，一眼看穿</span></h1>
  <div class="pill">数据更新：<b>实时模拟</b> · 每 4 秒刷新</div>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h3>GMV 转化漏斗（今日）</h3><div class="chart" id="c-funnel"></div></div>
  <div class="panel"><h3>渠道 GMV 归因</h3><div class="chart" id="c-channel"></div></div>
  <div class="panel wide"><h3>DAU / 新增 / 留存 趋势（30 天）</h3><div class="chart" id="c-trend"></div></div>
  <div class="panel"><h3>爆品榜 Top8（今日）</h3><table id="goods"></table></div>
  <div class="panel"><h3>分时段下单热力（24h）</h3><div class="chart" id="c-heat"></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>n>=10000?(n/10000).toFixed(1)+'w':n.toLocaleString();

// KPI
let gmv=1286400, dau=86320;
function renderKpis(){
  gmv+=Math.round(rnd(-2000,9000));dau=Math.max(60000,dau+Math.round(rnd(-300,500)));
  const k=[['今日 GMV','¥'+gmv.toLocaleString(),'','up','+12.4% 较昨日'],['DAU',dau.toLocaleString(),'','up','+5.1% 较昨日'],['转化率','3.42',' %','up','+0.18pt'],['客单价','¥'+(gmv/ (gmv/128)*1).toFixed(0),'','dn','-2.1% 需关注']];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="trend ${x[3]}">${x[4]}</div></div>`).join('');
}
renderKpis();

// 漏斗
const funnel=echarts.init(document.getElementById('c-funnel'));
let fdata=[{value:86320,name:'访客 UV'},{value:42150,name:'浏览商品'},{value:15800,name:'加入购物车'},{value:9420,name:'提交订单'},{value:7420,name:'支付成功'}];
function renderFunnel(){funnel.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}'},series:[{type:'funnel',left:'8%',right:'8%',top:8,bottom:8,sort:'descending',gap:3,label:{color:V('--txt'),fontSize:11,formatter:'{b}  {c}'},itemStyle:{borderWidth:0},data:fdata.map((d,i)=>({...d,itemStyle:{color:[V('--acc'),V('--sky'),V('--cyan'),V('--ok'),V('--lime')][i]}}))}]})}
renderFunnel();

// 渠道
const channel=echarts.init(document.getElementById('c-channel'));
const chans=[{name:'抖音直播',value:38},{name:'小红书种草',value:22},{name:'视频号',value:16},{name:'自然搜索',value:12},{name:'老客复购',value:8},{name:'其他',value:4}];
function renderChannel(){channel.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:V('--sub'),fontSize:10},itemWidth:10,itemHeight:10},series:[{type:'pie',radius:['42%','68%'],center:['50%','42%'],itemStyle:{borderColor:V('--p2'),borderWidth:2},label:{show:false},data:chans.map((c,i)=>({...c,itemStyle:{color:[V('--acc'),V('--pink'),V('--cyan'),V('--ok'),V('--warn'),V('--purple')][i]}}))}]})}
renderChannel();

// 趋势
const trend=echarts.init(document.getElementById('c-trend'));
const days=Array.from({length:30},(_,i)=>{const d=new Date(Date.now()-(29-i)*864e5);return (d.getMonth()+1)+'/'+d.getDate()});
let vDau=days.map(()=>Math.round(rnd(60000,95000))),vNew=days.map(()=>Math.round(rnd(4000,12000))),vRet=days.map(()=>+rnd(28,46).toFixed(1));
function renderTrend(){trend.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:V('--sub'),fontSize:11},top:0},grid:{left:52,right:44,top:34,bottom:26},xAxis:{type:'category',data:days,axisLabel:{color:V('--sub'),fontSize:10}},yAxis:[{type:'value',splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},{type:'value',max:60,axisLabel:{color:V('--sub'),fontSize:10,formatter:'{value}%'},splitLine:{show:false}}],series:[{name:'DAU',type:'line',data:vDau,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--acc')},areaStyle:{color:V('--acc')+'22'}},{name:'新增',type:'line',data:vNew,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--cyan')}},{name:'次留 %',type:'line',yAxisIndex:1,data:vRet,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--ok'),type:'dashed'}}]})}
renderTrend();

// 爆品榜
const goods=['山系冲锋衣','便携咖啡机','宠物智能喂食器','机械键盘 TKL','香薰蜡烛礼盒','折叠露营车','蓝牙耳机 Pro','筋膜枪 Mini'];
let gdata=goods.map(n=>({n,sales:Math.round(rnd(300,2200)),amt:0,trend:+rnd(-15,40).toFixed(1)}));
function renderGoods(){
  gdata.forEach(g=>{g.sales=Math.max(50,g.sales+Math.round(rnd(-40,60)));g.amt=g.sales*Math.round(rnd(89,899));});
  const sorted=[...gdata].sort((a,b)=>b.amt-a.amt);
  document.getElementById('goods').innerHTML='<tr><th>#</th><th>商品</th><th>销量</th><th>销售额</th><th>环比</th></tr>'+sorted.map((g,i)=>`<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span></td><td>${g.n}</td><td>${g.sales}</td><td>¥${g.amt.toLocaleString()}</td><td class="trend ${g.trend>=0?'up':'dn'}">${g.trend>=0?'▲':'▼'} ${Math.abs(g.trend)}%</td></tr>`).join('');
}
renderGoods();

// 热力
const heat=echarts.init(document.getElementById('c-heat'));
function renderHeat(){
  const inRange=document.documentElement.dataset.theme==='light'
    ?['#f1f5f9','#93c5fd','#3b82f6','#06b6d4','#84cc16']
    :['#0e1424','#1d3a8f','#4f8cff','#22d3ee','#a3e635'];
  heat.setOption({tooltip:{position:'top'},grid:{left:50,right:10,top:10,bottom:44},xAxis:{type:'category',data:Array.from({length:24},(_,i)=>i+'时'),axisLabel:{color:V('--sub'),fontSize:9,interval:1},splitArea:{show:false}},yAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日'],axisLabel:{color:V('--sub'),fontSize:10}},visualMap:{min:0,max:100,orient:'horizontal',left:'center',bottom:2,inRange:{color:inRange},textStyle:{color:V('--sub'),fontSize:10}},series:[{type:'heatmap',data:Array.from({length:168},(_,i)=>{const h=i%24,d=Math.floor(i/24);const peak=(h>=19&&h<=23)||(d>=5&&h>=10&&h<=15);return [h,d,Math.round(peak?rnd(55,100):rnd(5,50))]}),itemStyle:{borderColor:V('--p2'),borderWidth:1}}]});
}
renderHeat();

// 主题切换：图表按当前 CSS 变量重建
function retheme(){renderFunnel();renderChannel();renderTrend();renderHeat();}
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zwb-theme',t)}catch(e){}themeBtn.textContent=t==='light'?'🌙':'☀️';retheme();}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
themeBtn.textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️';

// 模拟实时
setInterval(()=>{
  renderKpis();renderGoods();
  fdata.forEach(d=>{d.value=Math.max(100,Math.round(d.value*rnd(0.98,1.03)))});fdata[0].value=dau;renderFunnel();
  vDau.shift();vDau.push(Math.round(rnd(60000,95000)));vNew.shift();vNew.push(Math.round(rnd(4000,12000)));renderTrend();
  chans.forEach(c=>{c.value=Math.max(4,Math.round(c.value*rnd(.97,1.05)))});renderChannel();
},4000);
window.addEventListener('resize',()=>[funnel,channel,trend,heat].forEach(c=>c.resize()));
</script>

<script>
window.AI_ASSISTANT={
  title:'增长分析台',subtitle:'GROWTH ANALYTICS',
  insights(){var top=gdata.slice().sort(function(a,b){return b.amt-a.amt})[0];
    var chan=chans.slice().sort(function(a,b){return b.value-a.value})[0];
    var cvr=(fdata[4].value/fdata[0].value*100).toFixed(2);
    return [
      {tag:'GMV',lv:'ok',text:'今日 GMV ¥'+gmv.toLocaleString()+'，DAU '+dau.toLocaleString()+'，收入端维持双位数增长。'},
      {tag:'转化',lv:cvr>=8?'ok':'warn',text:'访客→支付转化率 '+cvr+'%'+(cvr>=8?'，漏斗各层流失处于合理区间。':'，支付环节流失偏高，建议优化收银台链路。')},
      {tag:'爆品',lv:'info',text:'Top1 爆品「'+top.n+'」销售额 ¥'+top.amt.toLocaleString()+'，建议追加库存与素材投放。'},
      {tag:'渠道',lv:'info',text:'「'+chan.name+'」贡献 '+chan.value+'% GMV，为主要增长引擎。'}
    ];},
  advice(){var chan=chans.slice().sort(function(a,b){return a.value-b.value})[0];
    return ['「'+chan.name+'」占比最低，可做小预算 A/B 测试验证增量空间。','对 Top3 爆品做限时凑单策略，拉升客单价。'];},
  alerts(){var top=gdata.slice().sort(function(a,b){return b.amt-a.amt})[0];
    return Math.random()<.5?{lv:'ok',text:'✅ 爆品「'+top.n+'」今日销售额 ¥'+top.amt.toLocaleString()}:null;}
};
</script>
<script src="../../assets/ai-assistant/ai-assistant.js" defer></script>
<script src="../../assets/export-tools.js" defer></script>
</body>
</html>
