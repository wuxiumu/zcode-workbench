<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户成功台 · CRM Workbench | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#070b14;--p1:#0d1322;--p2:#0a0f1c;--line:#1c2740;--txt:#dfe7ff;--sub:#8494b8;--acc:#4f8cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 85% -10%,#0c2331 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.top h1{font-size:20px}.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;margin-top:4px}.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.chart{height:210px}.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid rgba(28,39,64,.5);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px}
.badge i{width:5px;height:5px;border-radius:50%}
.h-good{color:var(--ok);background:rgba(52,211,153,.1)}.h-good i{background:var(--ok)}
.h-mid{color:var(--warn);background:rgba(251,191,36,.1)}.h-mid i{background:var(--warn)}
.h-bad{color:var(--bad);background:rgba(248,113,113,.1)}.h-bad i{background:var(--bad)}
.risk{max-height:210px;overflow-y:auto}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:99px;padding:3px 12px}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>客户成功台 <span>CRM WORKBENCH · SaaS · 企业版客户视图</span></h1>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h3>MRR 走势（12 个月）</h3><div class="chart" id="c-mrr"></div></div>
  <div class="panel"><h3>销售管道漏斗</h3><div class="chart" id="c-pipe"></div></div>
  <div class="panel"><h3>客户健康度分布</h3><div class="chart" id="c-health"></div></div>
  <div class="panel wide"><h3>流失预警名单 · Churn Risk</h3><div class="risk"><table id="risk"></table></div></div>
  <div class="panel"><h3>行业客户占比</h3><div class="chart" id="c-ind"></div></div>
  <div class="panel"><h3>NPS 与工单趋势</h3><div class="chart" id="c-nps"></div></div>
  <div class="panel"><h3>续约日历（未来 30 天）</h3><div class="chart" id="c-renew"></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const rnd=(a,b)=>a+Math.random()*(b-a);
const M=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
// MRR
const mrr=echarts.init(document.getElementById('c-mrr'));
let mrrV=M.map((_,i)=>Math.round(380000*Math.pow(1.085,i)+rnd(-8000,8000)));
function renderMrr(){mrr.setOption({tooltip:{trigger:'axis'},grid:{left:60,right:16,top:20,bottom:26},xAxis:{type:'category',data:M,axisLabel:{color:'#8494b8',fontSize:10}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#141d33'}},axisLabel:{color:'#8494b8',fontSize:10,formatter:v=>(v/10000)+'w'}},series:[{type:'bar',data:mrrV,barWidth:14,itemStyle:{borderRadius:[4,4,0,0],color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#4f8cff'},{offset:1,color:'#1d3a8f'}]}}},{type:'line',data:mrrV,smooth:true,symbol:'circle',symbolSize:5,lineStyle:{width:2,color:'#22d3ee'}}]})}
renderMrr();
// 管道漏斗
const pipe=echarts.init(document.getElementById('c-pipe'));
pipe.setOption({tooltip:{trigger:'item'},series:[{type:'funnel',left:'6%',right:'6%',top:6,bottom:6,sort:'descending',gap:3,label:{color:'#dfe7ff',fontSize:11,formatter:'{b}  {c}'},data:[{value:286,name:'线索 Leads',itemStyle:{color:'#4f8cff'}},{value:172,name:'初步沟通',itemStyle:{color:'#38bdf8'}},{value:98,name:'方案演示',itemStyle:{color:'#22d3ee'}},{value:52,name:'商务谈判',itemStyle:{color:'#34d399'}},{value:31,name:'赢单 Won',itemStyle:{color:'#a3e635'}}]}]});
// 健康度
const health=echarts.init(document.getElementById('c-health'));
health.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#8494b8',fontSize:10},itemWidth:10,itemHeight:10},series:[{type:'pie',radius:['45%','70%'],center:['50%','42%'],label:{show:false},itemStyle:{borderColor:'#0a0f1c',borderWidth:2},data:[{value:58,name:'健康',itemStyle:{color:'#34d399'}},{value:27,name:'关注',itemStyle:{color:'#fbbf24'}},{value:15,name:'危险',itemStyle:{color:'#f87171'}}]}]});
// 行业
const ind=echarts.init(document.getElementById('c-ind'));
ind.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#8494b8',fontSize:10},itemWidth:10,itemHeight:10},series:[{type:'pie',radius:['0%','68%'],roseType:'radius',center:['50%','42%'],label:{color:'#8494b8',fontSize:10},data:[{value:32,name:'零售电商',itemStyle:{color:'#4f8cff'}},{value:24,name:'制造',itemStyle:{color:'#22d3ee'}},{value:18,name:'教育',itemStyle:{color:'#a78bfa'}},{value:14,name:'金融',itemStyle:{color:'#34d399'}},{value:12,name:'其他',itemStyle:{color:'#fbbf24'}}]}]});
// NPS
const nps=echarts.init(document.getElementById('c-nps'));
let npsV=M.map(()=>Math.round(rnd(30,62))),tkV=M.map(()=>Math.round(rnd(80,320)));
nps.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:'#8494b8',fontSize:10},top:0},grid:{left:40,right:40,top:30,bottom:26},xAxis:{type:'category',data:M,axisLabel:{color:'#8494b8',fontSize:10}},yAxis:[{type:'value',axisLabel:{color:'#8494b8',fontSize:10}},{type:'value',splitLine:{show:false},axisLabel:{color:'#8494b8',fontSize:10}}],series:[{name:'NPS',type:'line',data:npsV,smooth:true,lineStyle:{width:2,color:'#34d399'},areaStyle:{color:'#34d39922'}},{name:'工单量',type:'bar',yAxisIndex:1,data:tkV,barWidth:10,itemStyle:{color:'#4f8cff66',borderRadius:[3,3,0,0]}}]});
// 续约
const renew=echarts.init(document.getElementById('c-renew'));
const days=Array.from({length:30},(_,i)=>i+1);
renew.setOption({tooltip:{trigger:'axis'},grid:{left:36,right:12,top:16,bottom:24},xAxis:{type:'category',data:days.map(d=>d+'日'),axisLabel:{color:'#8494b8',fontSize:9,interval:2}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#141d33'}},axisLabel:{color:'#8494b8',fontSize:10}},series:[{type:'bar',data:days.map(d=>{const w=(d%7);return (w===2||w===4)?Math.round(rnd(4,14)):Math.round(rnd(0,4))}),barWidth:8,itemStyle:{borderRadius:[3,3,0,0],color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#fbbf24'},{offset:1,color:'#b4530966'}]}}}]});
// 流失预警
const riskData=[
  ['星洲连锁','零售电商',86,'14 天后到期','危险'],
  ['北岭制造','制造',74,'用量连续 3 周下降','危险'],
  ['蓝湾教育','教育',61,'工单响应超时 5 次','关注'],
  ['恒晟金融','金融',58,'管理员 45 天未登录','关注'],
  ['云帆物流','物流',52,'续约谈判中','关注'],
  ['橙光文创','文创',47,'套餐降级咨询','关注'],
  ['迅驰汽配','制造',41,'NPS 下降 12 分','关注'],
  ['晨曦生物','医药',33,'健康巡检正常','健康'],
];
const hCls={'危险':'h-bad','关注':'h-mid','健康':'h-good'};
document.getElementById('risk').innerHTML='<tr><th>客户</th><th>行业</th><th>风险分</th><th>信号</th><th>等级</th></tr>'+riskData.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td style="color:var(--sub)">${r[3]}</td><td><span class="badge ${hCls[r[4]]}"><i></i>${r[4]}</span></td></tr>`).join('');
// KPI
function renderKpis(){
  const mrrNow=mrrV[mrrV.length-1];
  document.getElementById('kpis').innerHTML=[
    ['MRR','¥'+(mrrNow/10000).toFixed(1)+'w','up','+8.5% MoM'],
    ['企业客户','1,286','up','本月 +23'],
    ['续约率','91.2',' %','up','+1.8pt'],
    ['NPS 净推荐值','47','','dn','-2 分'],
  ].map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="d ${x[3]}">${x[4]}</div></div>`).join('');
}
renderKpis();
window.addEventListener('resize',()=>[mrr,pipe,health,ind,nps,renew].forEach(c=>c.resize()));
</script>
</body>
</html>
