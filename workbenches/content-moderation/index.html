<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容审核台 · Trust & Safety | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>/* CDN 三级回退：国内镜像 → unpkg → cdnjs；全部失败则 stub 兜底保住数据面板 */window.echarts||document.write("<script src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'><\/script>")</script>
<script>window.echarts||(window.echarts={init:el=>{try{el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8494b8;font-size:12px">📉 图表库加载失败 · 文字数据面板不受影响</div>'}catch(e){}return{setOption(){},getOption(){return{}},resize(){}}}})</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zwb-theme')||'dark'}catch(e){}</script>
<style>
:root{--bg:#070b14;--p1:#0d1322;--p2:#0a0f1c;--line:#1c2740;--txt:#dfe7ff;--sub:#8494b8;--acc:#4f8cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--purple:#a78bfa;--pink:#f472b6;--glow:#2a123a;--track:#182242;--split:#141d33;--acc-soft:rgba(79,140,255,.1);--ok-soft:rgba(52,211,153,.1);--warn-soft:rgba(251,191,36,.1);--warn-line:rgba(251,191,36,.3);--bad-soft:rgba(248,113,113,.1)}
[data-theme="light"]{--bg:#f5f7fa;--p1:#ffffff;--p2:#f7f9fc;--line:#e3e8ef;--txt:#1f2733;--sub:#5a6675;--acc:#2f6cff;--ok:#0e9f6e;--warn:#d97706;--bad:#dc2626;--purple:#7c3aed;--pink:#db2777;--glow:#efe2f5;--track:#e8edf5;--split:#e3e8ef;--acc-soft:rgba(47,108,255,.09);--ok-soft:rgba(14,159,110,.1);--warn-soft:rgba(217,119,6,.1);--warn-line:rgba(217,119,6,.35);--bad-soft:rgba(220,38,38,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 85% -10%,var(--glow) 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-right:56px}
.top h1{font-size:20px;display:flex;align-items:center;gap:10px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.pill{font-size:12px;color:var(--sub);background:var(--p1);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.pill b{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:.06em}
.panel h3 .chip{float:right;font-size:11px;letter-spacing:0;color:var(--sub)}
.chart{height:220px}.chart-lg{height:300px}.wide{grid-column:1/-1}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);letter-spacing:.05em;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--split);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px}
.badge i{width:5px;height:5px;border-radius:50%}
.st-ok{color:var(--ok);background:var(--ok-soft)}.st-ok i{background:var(--ok)}
.st-warn{color:var(--warn);background:var(--warn-soft)}.st-warn i{background:var(--warn)}
.st-bad{color:var(--bad);background:var(--bad-soft)}.st-bad i{background:var(--bad)}
.st-info{color:var(--acc);background:var(--acc-soft)}.st-info i{background:var(--acc)}
.trend{font-size:11px}.trend.up{color:var(--ok)}.trend.dn{color:var(--bad)}
.theme-btn{position:fixed;right:16px;top:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:scale(1.1);border-color:var(--acc)}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:99px;padding:3px 12px;letter-spacing:.1em}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换亮 / 暗主题"></button>
<div class="top">
  <h1><span class="dot"></span>内容审核台 <span>TRUST &amp; SAFETY · safety-suite v1 · 机审 × 人审 × 申诉</span></h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="clock" id="clock"></span>
    <span class="pill">数据更新：<b>实时模拟</b> · 每 3.5 秒刷新</span>
  </div>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel wide"><h3>审核量分时分布 · 机审 vs 人审（堆叠）<span class="chip" id="hrChip"></span></h3><div class="chart" id="c-hour"></div></div>
  <div class="panel"><h3>违规类型分布 · 今日拦截<span class="chip" id="catChip"></span></h3><div class="chart-lg" id="c-cat"></div></div>
  <div class="panel"><h3>近 14 天拦截率趋势<span class="chip" id="blChip"></span></h3><div class="chart-lg" id="c-block"></div></div>
  <div class="panel"><h3>审核时效 · 目标 ≤ 5 分钟</h3><div class="chart-lg" id="c-time"></div></div>
  <div class="panel"><h3>高风险账号 Top8 · 近 7 天<span class="chip" id="riskChip"></span></h3><div class="tscroll"><table id="risk"></table></div></div>
  <div class="panel wide"><h3>申诉处理工单 · 今日<span class="chip" id="apChip"></span></h3><div class="tscroll"><table id="appeals"></table></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.round(rnd(a,b));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const last=a=>a[a.length-1];
const H24=Array.from({length:24},(_,i)=>i+'时');
const d14=Array.from({length:14},(_,i)=>{const d=new Date(Date.now()-(13-i)*864e5);return (d.getMonth()+1)+'/'+d.getDate()});
const fmtW=v=>(v/10000).toFixed(1)+' 万';

// KPI 基础量
let pending=1284,reviewed=24680,blockRate=3.8,avgMin=4.2;

// 审核量分时（今日）：机审 / 人审
let machine=[720,540,410,360,390,460,820,1180,1360,1420,1310,1250,1180,1220,1280,1350,1290,1120,980,860,790,760,740,700];
let human=[120,95,70,60,65,85,160,240,290,310,280,260,250,255,270,285,265,230,205,185,170,160,150,140];

// 违规类型分布（今日拦截）· 颜色存 CSS 变量名
let cats=[['广告',396,'--acc'],['色情',168,'--pink'],['侵权',142,'--purple'],['谣言',112,'--warn'],['其他',92,'--sub'],['暴恐',28,'--bad']];

// 近 14 天拦截率（%）
let block14=d14.map(()=>+rnd(3.2,4.4).toFixed(2));

// 申诉工单
const ATYPES=['广告','色情','暴恐','侵权','谣言','其他'];
const AORIG=['机审拦截','删除 + 禁言 7 天','下架处理','限流 24h','封号 30 天'];
const ARES=[{t:'申诉成立',cls:'st-ok',tag:'成立 · 恢复'},{t:'部分成立',cls:'st-warn',tag:'部分成立'},{t:'维持原判',cls:'st-info',tag:'维持原判'}];
let apNext=114209,apTotal=126,apRate=31.2;
let appeals=[
  {id:'AP-114208',type:'广告',orig:'机审拦截',res:ARES[2]},
  {id:'AP-114195',type:'谣言',orig:'删除 + 禁言 7 天',res:ARES[2]},
  {id:'AP-114187',type:'侵权',orig:'下架处理',res:ARES[0]},
  {id:'AP-114166',type:'其他',orig:'限流 24h',res:ARES[0]},
  {id:'AP-114152',type:'广告',orig:'机审拦截',res:ARES[1]},
  {id:'AP-114149',type:'色情',orig:'封号 30 天',res:ARES[2]},
  {id:'AP-114133',type:'侵权',orig:'下架处理',res:ARES[0]},
  {id:'AP-114121',type:'暴恐',orig:'封号 + 风控',res:ARES[2]}];
const genAppeal=()=>{const r=Math.random();return {id:'AP-'+(apNext++),type:ATYPES[irnd(0,ATYPES.length-1)],orig:AORIG[irnd(0,AORIG.length-1)],res:r<.31?ARES[0]:r<.52?ARES[1]:ARES[2]}};

// 高风险账号 Top8（近 7 天）
const RST={永久封禁:'st-bad','限流 7 天':'st-warn',观察名单:'st-info',警告教育:'st-ok'};
let risks=[
  {a:'喜马拉雅_-bot07',h:42,re:'广告 · 8 分钟前',st:'永久封禁'},
  {a:'u****37',h:35,re:'色情 · 22 分钟前',st:'永久封禁'},
  {a:'转发部_03',h:28,re:'谣言 · 1 小时前',st:'限流 7 天'},
  {a:'导流小助手',h:24,re:'广告 · 2 小时前',st:'限流 7 天'},
  {a:'st****9k',h:19,re:'侵权 · 3 小时前',st:'观察名单'},
  {a:'羊毛党_66',h:15,re:'广告 · 4 小时前',st:'观察名单'},
  {a:'影视剪辑王',h:12,re:'侵权 · 5 小时前',st:'观察名单'},
  {a:'m****12x',h:9,re:'其他 · 6 小时前',st:'警告教育'}];

// KPI · 审核总览
function renderKpis(){
  pending=clamp(pending+irnd(-30,36),900,1800);
  reviewed=clamp(reviewed+irnd(-150,190),23000,27500);
  blockRate=+clamp(blockRate+rnd(-.15,.15),3,4.6).toFixed(1);
  avgMin=+clamp(avgMin+rnd(-.18,.18),3.2,5.8).toFixed(1);
  const blocked=Math.round(reviewed*blockRate/100);
  const k=[
    ['今日待审',pending.toLocaleString(),' 条','up','机审先行 · 队列实时消化'],
    ['今日已审',reviewed.toLocaleString(),' 条','up',`拦截 ${blocked.toLocaleString()} 条 · 待复核 26 条`],
    ['拦截率',blockRate,' %',blockRate<4?'up':'dn',`近 7 天均值 ${(block14.slice(7).reduce((a,b)=>a+b,0)/7).toFixed(2)}%`],
    ['平均审核时长',avgMin,' 分',avgMin<=5?'up':'dn',avgMin<=5?'目标 ≤ 5 分钟 · 达标':'超过 5 分钟 · 需加派审核员']];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="trend ${x[3]}">${x[4]}</div></div>`).join('');
}

// 审核量分时堆叠柱状图（机审 / 人审）
const hourC=echarts.init(document.getElementById('c-hour'));
function renderHour(){
  hourC.setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},legend:{data:['机审','人审'],textStyle:{color:V('--sub'),fontSize:10},top:0,itemWidth:10,itemHeight:10},
    grid:{left:44,right:14,top:30,bottom:24},
    xAxis:{type:'category',data:H24,axisLabel:{color:V('--sub'),fontSize:9,interval:2}},
    yAxis:{type:'value',nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
    series:[
      {name:'机审',type:'bar',stack:'total',data:machine.map(v=>clamp(v+irnd(-18,22),0,1600)),barWidth:'62%',itemStyle:{color:V('--acc')}},
      {name:'人审',type:'bar',stack:'total',data:human.map(v=>clamp(v+irnd(-8,10),0,400)),itemStyle:{color:V('--warn'),borderRadius:[3,3,0,0]}}]});
  const mT=machine.reduce((a,b)=>a+b,0),hT=human.reduce((a,b)=>a+b,0);
  document.getElementById('hrChip').textContent=`机审 ${fmtW(mT)} · 人审 ${hT.toLocaleString()} 条 · 人工占比 ${(hT/(mT+hT)*100).toFixed(1)}%`;
}

// 违规类型分布（环形饼图）
const catC=echarts.init(document.getElementById('c-cat'));
function renderCat(){
  cats=cats.map(([n,v,c])=>[n,Math.max(10,v+irnd(-6,8)),c]);
  const total=cats.reduce((a,b)=>a+b[1],0),top=[...cats].sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('catChip').textContent=`今日拦截 ${total} 条 · Top1 ${top[0]}`;
  catC.setOption({tooltip:{formatter:f=>`${f.name}　<b>${f.value}</b> 条（${f.percent}%）`},
    legend:{bottom:0,textStyle:{color:V('--sub'),fontSize:10},itemWidth:10,itemHeight:10},
    series:[{type:'pie',radius:['40%','68%'],center:['50%','46%'],
      itemStyle:{borderColor:V('--p2'),borderWidth:2,borderRadius:4},
      label:{show:false},
      data:cats.map(x=>({name:x[0],value:x[1],itemStyle:{color:V(x[2])}}))}]});
}

// 近 14 天拦截率趋势
const blC=echarts.init(document.getElementById('c-block'));
function renderBlock(){
  blC.setOption({tooltip:{trigger:'axis',valueFormatter:v=>v+'%'},legend:{data:['拦截率'],textStyle:{color:V('--sub'),fontSize:10},top:0,itemWidth:10,itemHeight:10},
    grid:{left:36,right:14,top:30,bottom:24},
    xAxis:{type:'category',data:d14,axisLabel:{color:V('--sub'),fontSize:9,interval:3}},
    yAxis:{type:'value',min:2,max:5,nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10,formatter:'{value}%'}},
    series:[{name:'拦截率',type:'line',data:block14,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--purple')},itemStyle:{color:V('--purple')},
      areaStyle:{color:V('--purple')+'1a'},
      markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:V('--ok')+'b3'},
        data:[{yAxis:4,label:{formatter:'警戒 4%',position:'insideEndTop',color:V('--ok'),fontSize:9}}]}}]});
  document.getElementById('blChip').textContent=`今日 ${blockRate}% · 峰值 ${Math.max(...block14)}%`;
}

// 审核时效 gauge（目标 ≤ 5 分钟，>6 分钟红区）
const timeC=echarts.init(document.getElementById('c-time'));
function renderTime(){
  avgMin=+clamp(avgMin+rnd(-.18,.18),3.2,5.8).toFixed(1);
  timeC.setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:10,splitNumber:5,center:['50%','56%'],radius:'95%',
    axisLine:{lineStyle:{width:12,color:[[.3,V('--ok')],[.5,V('--warn')],[1,V('--bad')]]}},
    pointer:{length:'58%',width:4,itemStyle:{color:V('--txt')}},
    axisTick:{distance:-12,length:4,lineStyle:{color:V('--p2'),width:1}},
    splitLine:{distance:-14,length:12,lineStyle:{color:V('--p2'),width:2}},
    axisLabel:{distance:14,color:V('--sub'),fontSize:9,formatter:'{value} 分'},
    detail:{valueAnimation:true,formatter:'{value} 分',color:avgMin<=5?V('--ok'):V('--bad'),fontSize:24,fontWeight:700,offsetCenter:[0,'58%']},
    title:{offsetCenter:[0,'92%'],color:V('--sub'),fontSize:11},
    data:[{value:avgMin,name:'平均审核时长 · 目标 ≤ 5 分钟'}]}]});
}

// 高风险账号 Top8（处置徽标）
function renderRisk(){
  risks=risks.map(r=>({...r,h:Math.max(3,r.h+irnd(-2,3))}));
  const rows=[...risks].sort((a,b)=>b.h-a.h);
  const ban=rows.filter(r=>r.st==='永久封禁').length,hits=rows.reduce((a,b)=>a+b.h,0);
  document.getElementById('riskChip').textContent=`Top8 命中 ${hits} 次 · 封禁 ${ban} 个`;
  document.getElementById('risk').innerHTML='<tr><th>账号</th><th>命中</th><th>最近违规</th><th>处置状态</th></tr>'+
    rows.map(r=>`<tr><td>${r.a}</td><td>${r.h}</td><td>${r.re}</td><td><span class="badge ${RST[r.st]}"><i></i>${r.st}</span></td></tr>`).join('');
}

// 申诉处理工单表（成立 / 部分成立 / 维持原判）
function renderAppeals(){
  if(Math.random()<.25){appeals.pop();appeals.unshift(genAppeal());}
  apTotal=clamp(apTotal+irnd(-2,3),100,160);
  apRate=+clamp(apRate+rnd(-.4,.4),24,38).toFixed(1);
  const ok=appeals.filter(a=>a.res.t==='申诉成立').length;
  document.getElementById('apChip').textContent=`今日申诉 ${apTotal} 单 · 成立率 ${apRate}% · 表内成立 ${ok} 单`;
  document.getElementById('appeals').innerHTML='<tr><th>申诉单号</th><th>违规类型</th><th>原判处置</th><th>申诉结果</th></tr>'+
    appeals.map(a=>`<tr><td>${a.id}</td><td>${a.type}</td><td>${a.orig}</td><td><span class="badge ${a.res.cls}"><i></i>${a.res.tag}</span></td></tr>`).join('');
}

// 时钟
const tickClock=()=>{document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})};

// 主题切换：图表按当前 CSS 变量重建
function retheme(){renderHour();renderCat();renderBlock();renderTime();}
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zwb-theme',t)}catch(e){}themeBtn.textContent=t==='light'?'🌙':'☀️';retheme();}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
themeBtn.textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️';

// 模拟实时
function tick(){
  block14.shift();block14.push(+rnd(3.2,4.4).toFixed(2));
  renderKpis();renderHour();renderCat();renderBlock();renderTime();renderRisk();renderAppeals();
}
renderKpis();renderHour();renderCat();renderBlock();renderTime();renderRisk();renderAppeals();
tickClock();setInterval(tickClock,1000);
setInterval(tick,3500);
window.addEventListener('resize',()=>[hourC,catC,blC,timeC].forEach(c=>c.resize()));
</script>
</body>
</html>
