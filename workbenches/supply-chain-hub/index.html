<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应链协同台 · Supply Chain Hub | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>/* CDN 三级回退：国内镜像 → unpkg → cdnjs；全部失败则 stub 兜底保住数据面板 */window.echarts||document.write("<script src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'><\/script>")</script>
<script>window.echarts||document.write("<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js'><\/script>")</script>
<script>window.echarts||(window.echarts={init:el=>{try{el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8494b8;font-size:12px">📉 图表库加载失败 · 文字数据面板不受影响</div>'}catch(e){}return{setOption(){},getOption(){return{}},resize(){}}}})</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zwb-theme')||'dark'}catch(e){}</script>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
:root{--acc:#4f8cff;--sky:#38bdf8;--cyan:#22d3ee;--lime:#a3e635;--gold:#facc15;--glow:#0d2733;--acc-deep:#1d3a8f;--acc-soft:rgba(79,140,255,.1);--ok-soft:rgba(52,211,153,.1);--warn-soft:rgba(251,191,36,.1);--warn-line:rgba(251,191,36,.3);--bad-soft:rgba(248,113,113,.1);}
[data-theme="light"]{--acc:#2f6cff;--sky:#0284c7;--cyan:#0891b2;--lime:#65a30d;--gold:#ca8a04;--glow:#dceef4;--acc-deep:#9db9f7;--acc-soft:rgba(47,108,255,.09);--ok-soft:rgba(14,159,110,.1);--warn-soft:rgba(217,119,6,.1);--warn-line:rgba(217,119,6,.35);--bad-soft:rgba(220,38,38,.08);}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 85% -10%,var(--glow) 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-right:56px}
.top h1{font-size:20px;display:flex;align-items:center;gap:10px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.pill{font-size:12px;color:var(--sub);background:var(--p1);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.pill b{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:.06em}
.panel h3 .chip{float:right;font-size:11px;letter-spacing:0;color:var(--bad)}
.chart{height:220px}.wide{grid-column:1/-1}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);letter-spacing:.05em;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--split);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px}
.badge i{width:5px;height:5px;border-radius:50%}
.st-ok{color:var(--ok);background:var(--ok-soft)}.st-ok i{background:var(--ok)}
.st-warn{color:var(--warn);background:var(--warn-soft)}.st-warn i{background:var(--warn)}
.st-bad{color:var(--bad);background:var(--bad-soft)}.st-bad i{background:var(--bad)}
.st-info{color:var(--acc);background:var(--acc-soft)}.st-info i{background:var(--acc)}
.rank{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;background:var(--track);color:var(--sub)}
.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1206;font-weight:700}
.r2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#1a1206;font-weight:700}
.r3{background:linear-gradient(135deg,#f59e0b99,#b4530999);color:#fff;font-weight:700}
.trend{font-size:11px}.trend.up{color:var(--ok)}.trend.dn{color:var(--bad)}
.theme-btn{position:fixed;right:16px;top:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:scale(1.1);border-color:var(--acc)}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:99px;padding:3px 12px;letter-spacing:.1em}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换亮 / 暗主题"></button>
<div class="top">
  <h1><span class="dot"></span>供应链协同台 <span>SUPPLY CHAIN HUB · sc-hub-prod ｜ 哪个仓库快缺货、哪家供应商拖了后腿</span></h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="clock" id="clock"></span>
    <span class="pill">数据更新：<b>实时模拟</b> · 每 3.5 秒刷新</span>
  </div>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h3>库存周转天数 · 目标 ≤ 45 天</h3><div class="chart" id="c-turn"></div></div>
  <div class="panel"><h3>采购履约漏斗（本月）</h3><div class="chart" id="c-funnel"></div></div>
  <div class="panel"><h3>各仓库存分布（金额 / 周转天数）</h3><div class="chart" id="c-wh"></div></div>
  <div class="panel"><h3>供应商绩效 Top5（本月）</h3><div class="tscroll"><table id="sups"></table></div></div>
  <div class="panel wide"><h3>近 30 天订单履约时效趋势</h3><div class="chart" id="c-trend"></div></div>
  <div class="panel wide"><h3>缺料预警清单 · Shortage Alerts<span class="chip" id="alertChip"></span></h3><div class="tscroll"><table id="alerts"></table></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.round(rnd(a,b));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const days=Array.from({length:30},(_,i)=>{const d=new Date(Date.now()-(29-i)*864e5);return (d.getMonth()+1)+'/'+d.getDate()});

// KPI · 库存水位总览
let sku=8462,alertN=37,transit=128,dead=286.4;
function renderKpis(){
  sku=clamp(sku+irnd(-6,9),8300,8700);alertN=clamp(alertN+irnd(-3,3),24,52);
  transit=clamp(transit+irnd(-8,9),90,190);dead=+clamp(dead+rnd(-1.6,.9),240,320).toFixed(1);
  const k=[
    ['SKU 总数',sku.toLocaleString(),' 在库','up','+1.8% 较上月'],
    ['安全库存预警',alertN,' 项','dn','▲3 低于安全水位'],
    ['在途采购单',transit,' 单','up','在途金额 ¥2,418 万'],
    ['呆滞库存','¥'+dead,' 万','up','▼3.2% 持续清理']
  ];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="trend ${x[3]}">${x[4]}</div></div>`).join('');
}

// 库存周转 gauge
const turnC=echarts.init(document.getElementById('c-turn'));
let turnDays=42.6;
function renderTurn(){
  turnDays=+clamp(turnDays+rnd(-.5,.5),36,52).toFixed(1);
  turnC.setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:90,splitNumber:6,center:['50%','56%'],radius:'95%',
    axisLine:{lineStyle:{width:12,color:[[.5,V('--ok')],[.78,V('--warn')],[1,V('--bad')]]}},
    pointer:{length:'58%',width:4,itemStyle:{color:V('--txt')}},
    axisTick:{distance:-12,length:4,lineStyle:{color:V('--p2'),width:1}},
    splitLine:{distance:-14,length:12,lineStyle:{color:V('--p2'),width:2}},
    axisLabel:{distance:14,color:V('--sub'),fontSize:9},
    detail:{valueAnimation:true,formatter:'{value} 天',color:V('--txt'),fontSize:22,fontWeight:700,offsetCenter:[0,'58%']},
    title:{offsetCenter:[0,'92%'],color:V('--sub'),fontSize:11},
    data:[{value:turnDays,name:'平均周转天数 · 目标 ≤ 45'}]}]});
}

// 采购履约漏斗
const funnelC=echarts.init(document.getElementById('c-funnel'));
let fdata=[
  {value:1240,name:'采购需求'},{value:986,name:'询价比价'},{value:742,name:'PO 下达'},
  {value:618,name:'供应商发货'},{value:534,name:'到货质检'},{value:489,name:'入库上架'}];
function renderFunnel(){
  funnelC.setOption({tooltip:{trigger:'item',formatter:'{b}: {c} 单'},series:[{type:'funnel',left:'6%',right:'6%',top:8,bottom:8,sort:'descending',gap:3,
    label:{color:V('--txt'),fontSize:11,formatter:'{b}  {c}'},itemStyle:{borderWidth:0},
    data:fdata.map((d,i)=>({...d,itemStyle:{color:[V('--acc'),V('--sky'),V('--cyan'),V('--ok'),V('--lime'),V('--gold')][i]}}))}]});
}

// 各仓库存分布
const whC=echarts.init(document.getElementById('c-wh'));
const whs=['华东总仓','华南仓','华北仓','西南仓','华中仓','保税仓'];
let whAmt=whs.map(()=>irnd(180,860)),whDay=whs.map(()=>+rnd(30,62).toFixed(1));
function renderWh(){
  whAmt=whAmt.map(v=>+clamp(v+rnd(-12,12),120,920).toFixed(0));
  whDay=whDay.map(v=>+clamp(v+rnd(-1.2,1.2),28,70).toFixed(1));
  whC.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:V('--sub'),fontSize:10},top:0},
    grid:{left:44,right:44,top:34,bottom:26},
    xAxis:{type:'category',data:whs,axisLabel:{color:V('--sub'),fontSize:10}},
    yAxis:[{name:'万元',type:'value',splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
           {name:'天',type:'value',max:80,splitLine:{show:false},axisLabel:{color:V('--sub'),fontSize:10}}],
    series:[
      {name:'库存金额',type:'bar',data:whAmt,barWidth:14,itemStyle:{borderRadius:[4,4,0,0],color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:V('--acc')},{offset:1,color:V('--acc-deep')}]}}},
      {name:'周转天数',type:'line',yAxisIndex:1,data:whDay,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--warn')}}]});
}

// 供应商绩效 Top5
const sups=[
  {n:'联达精密',otd:98.6,pass:99.2,resp:2.1,score:96.4},
  {n:'华振电子',otd:96.8,pass:98.5,resp:3.4,score:93.8},
  {n:'宏达金属',otd:95.2,pass:97.6,resp:4.8,score:91.2},
  {n:'恒信橡塑',otd:93.4,pass:96.1,resp:6.2,score:88.5},
  {n:'晨光五金',otd:91.7,pass:95.3,resp:7.5,score:86.9}];
function renderSups(){
  sups.forEach(s=>{s.otd=+clamp(s.otd+rnd(-.6,.6),88,99.9).toFixed(1);s.pass=+clamp(s.pass+rnd(-.4,.4),92,99.9).toFixed(1);
    s.resp=+clamp(s.resp+rnd(-.5,.5),1.5,9).toFixed(1);s.score=+clamp(s.score+rnd(-.5,.5),80,99).toFixed(1);});
  const sorted=[...sups].sort((a,b)=>b.score-a.score);
  document.getElementById('sups').innerHTML='<tr><th>#</th><th>供应商</th><th>准时交付率</th><th>质检合格率</th><th>响应时效</th><th>综合评分</th></tr>'+
    sorted.map((s,i)=>`<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span></td><td>${s.n}</td><td>${s.otd}%</td><td>${s.pass}%</td><td>${s.resp} h</td><td style="color:${s.score>=92?'var(--ok)':s.score>=88?'var(--warn)':'var(--bad)'};font-weight:700">${s.score}</td></tr>`).join('');
}

// 缺料预警清单
const LV={紧急:'st-bad',高:'st-warn',中:'st-info'},LVORD={紧急:0,高:1,中:2};
let alerts=[
  {lv:'紧急',mat:'MCU 主控芯片 XM-C6',gap:2400,unit:'件',po:12,sup:'联达精密',eta:'11/14'},
  {lv:'紧急',mat:'锂电芯 21700',gap:8000,unit:'颗',po:8,sup:'华振能源',eta:'11/16'},
  {lv:'高',mat:'6063 铝型材',gap:1.2,unit:'吨',po:5,sup:'宏达金属',eta:'11/13'},
  {lv:'高',mat:'ABS 面板 · 灰',gap:3500,unit:'件',po:4,sup:'恒信橡塑',eta:'11/15'},
  {lv:'中',mat:'M3 螺丝套件',gap:20000,unit:'套',po:2,sup:'晨光五金',eta:'11/18'},
  {lv:'中',mat:'硅胶密封圈',gap:5600,unit:'件',po:2,sup:'恒信橡塑',eta:'11/20'}];
function renderAlerts(){
  alerts.forEach(a=>{a.gap=+clamp(a.gap*(1+rnd(-.02,.02)),0,999999).toFixed(a.gap<10?1:0)});
  const rows=[...alerts].sort((a,b)=>LVORD[a.lv]-LVORD[b.lv]);
  const cnt=lv=>alerts.filter(a=>a.lv===lv).length;
  document.getElementById('alertChip').textContent=`紧急 ${cnt('紧急')} · 高 ${cnt('高')} · 中 ${cnt('中')}`;
  document.getElementById('alerts').innerHTML='<tr><th>等级</th><th>物料</th><th>缺口</th><th>影响订单</th><th>供应商</th><th>预计恢复</th></tr>'+
    rows.map(a=>`<tr><td><span class="badge ${LV[a.lv]}"><i></i>${a.lv}</span></td><td>${a.mat}</td><td>${a.gap} ${a.unit}</td><td>${a.po}</td><td>${a.sup}</td><td>${a.eta}</td></tr>`).join('');
}

// 近 30 天订单履约时效趋势
const trendC=echarts.init(document.getElementById('c-trend'));
let vOrd=days.map(()=>irnd(320,560)),vHr=days.map(()=>+rnd(38,58).toFixed(1)),vOtd=days.map(()=>+rnd(86,97).toFixed(1));
function renderTrend(){
  trendC.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:V('--sub'),fontSize:11},top:0},
    grid:{left:44,right:46,top:34,bottom:26},
    xAxis:{type:'category',data:days,axisLabel:{color:V('--sub'),fontSize:10}},
    yAxis:[{name:'单 / 小时',type:'value',nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{lineStyle:{color:V('--split')}},axisLabel:{color:V('--sub'),fontSize:10}},
           {name:'%',type:'value',max:100,nameTextStyle:{color:V('--sub'),fontSize:10},splitLine:{show:false},axisLabel:{color:V('--sub'),fontSize:10,formatter:'{value}%'}}],
    series:[
      {name:'履约订单',type:'bar',data:vOrd,barWidth:8,itemStyle:{borderRadius:[3,3,0,0],color:V('--acc')+'8c'}},
      {name:'平均履约时长',type:'line',data:vHr,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--cyan')},areaStyle:{color:V('--cyan')+'22'}},
      {name:'准时交付率',type:'line',yAxisIndex:1,data:vOtd,smooth:true,showSymbol:false,lineStyle:{width:2,color:V('--ok'),type:'dashed'}}]});
}

// 时钟
const tickClock=()=>{document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})};

// 主题切换：图表按当前 CSS 变量重建
function retheme(){renderTurn();renderFunnel();renderWh();renderTrend();}
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zwb-theme',t)}catch(e){}themeBtn.textContent=t==='light'?'🌙':'☀️';retheme();}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
themeBtn.textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️';

// 模拟实时
function tick(){
  fdata.forEach(d=>{d.value=Math.max(80,Math.round(d.value*rnd(.98,1.02)))});
  vOrd.shift();vOrd.push(irnd(320,560));vHr.shift();vHr.push(+rnd(38,58).toFixed(1));vOtd.shift();vOtd.push(+rnd(86,97).toFixed(1));
  renderKpis();renderTurn();renderFunnel();renderWh();renderSups();renderAlerts();renderTrend();
}
renderKpis();renderTurn();renderFunnel();renderWh();renderSups();renderAlerts();renderTrend();
tickClock();setInterval(tickClock,1000);
setInterval(tick,3500);
window.addEventListener('resize',()=>[turnC,funnelC,whC,trendC].forEach(c=>c.resize()));
</script>

<script>
window.AI_ASSISTANT={
  title:'供应链协同台',subtitle:'SUPPLY CHAIN HUB',
  insights(){var em=alerts.filter(function(a){return a.lv==='紧急'});
    var minS=sups.slice().sort(function(a,b){return a.score-b.score})[0];
    return [
      {tag:'缺料',lv:em.length?'bad':'ok',text:em.length?('有 '+em.length+' 项紧急缺料，最高缺口 '+em[0].mat+' '+em[0].gap+' '+em[0].unit+'，影响 '+em[0].po+' 张订单。'):'当前无紧急缺料，物料齐套正常。'},
      {tag:'周转',lv:turnDays<=45?'ok':'warn',text:'库存周转 '+turnDays+' 天'+(turnDays<=45?'，优于 45 天目标。':'，超 45 天目标，建议清理慢动销 SKU。')},
      {tag:'呆滞',lv:dead>300?'warn':'ok',text:'呆滞库存 ¥'+dead+' 万'+(dead>300?'，超过 ¥300 万警戒线。':'，处于可控区间。')},
      {tag:'供应商',lv:minS.score>=90?'ok':'warn',text:'最低分为「'+minS.n+'」（'+minS.score+' 分），'+(minS.score>=90?'整体供应商质量良好。':'建议启动绩效辅导或备选准入。')}
    ];},
  advice(){return ['对紧急缺料物料启动备选供应商询价，缩短恢复周期。','呆滞 Top3 SKU 打包促销或折价清仓，回笼现金流。'];},
  alerts(){var em=alerts.filter(function(a){return a.lv==='紧急'})[0];
    return em?{lv:'bad',text:'🔴 缺料预警：'+em.mat+' 缺口 '+em.gap+' '+em.unit+'，影响 '+em.po+' 张订单'}:null;}
};
</script>
<script src="../../assets/ai-assistant/ai-assistant.js" defer></script>
</body>
</html>
