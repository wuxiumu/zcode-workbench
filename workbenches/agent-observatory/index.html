<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 观测台 · Agent Observatory | ZCode Labs</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#070b14;--p1:#0d1322;--p2:#0a0f1c;--line:#1c2740;--txt:#dfe7ff;--sub:#8494b8;--acc:#4f8cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--cy:#22d3ee}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 20% -10%,#0a2a2a 0%,var(--bg) 60%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:22px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.top h1{font-size:20px}.top h1 span{color:var(--sub);font-size:13px;font-weight:400}
.live{font-size:11px;color:var(--ok);border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.08);border-radius:99px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:400}
.kpi .d{font-size:11px;margin-top:4px}.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.chart{height:200px}.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(28,39,64,.5);font-variant-numeric:tabular-nums}
.model{font-size:11px;padding:2px 8px;border-radius:6px;display:inline-block}
.m1{color:#4f8cff;background:rgba(79,140,255,.12)}.m2{color:#22d3ee;background:rgba(34,211,238,.12)}.m3{color:#a78bfa;background:rgba(167,139,250,.12)}.m4{color:#f472b6;background:rgba(244,114,182,.12)}
.trace-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(28,39,64,.5);font-size:12px}
.trace-row .name{width:170px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trace-row .bar-wrap{flex:1;height:10px;position:relative;background:#131c33;border-radius:5px}
.trace-row .bar{position:absolute;height:10px;border-radius:5px}
.trace-row .dur{width:80px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.mock{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:99px;padding:3px 12px}
.back{position:fixed;left:16px;bottom:14px;font-size:12px}.back a{color:var(--acc);text-decoration:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>AI Agent 观测台 <span>AGENT OBSERVATORY · LLM 应用生产可观测</span></h1>
  <span class="live"><i></i>TRACE STREAMING</span>
</div>

<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h3>Token 吞吐（每分钟）</h3><div class="chart" id="c-tok"></div></div>
  <div class="panel"><h3>模型调用延迟分布 P50/P95/P99</h3><div class="chart" id="c-lat"></div></div>
  <div class="panel wide"><h3>Trace 瀑布 · 最近调用</h3><div id="traces"></div></div>
  <div class="panel"><h3>模型调用占比 & 成本</h3><table id="models"></table></div>
  <div class="panel"><h3>成本燃烧曲线（7 天 · $）</h3><div class="chart" id="c-cost"></div></div>
</div>

<div class="back"><a href="../../">← 返回工作台矩阵</a></div>
<div class="mock">MOCK DATA · 演示数据</div>

<script>
const rnd=(a,b)=>a+Math.random()*(b-a);
const N=50;
// Token 吞吐
const tok=echarts.init(document.getElementById('c-tok'));
let tokIn=Array.from({length:N},()=>Math.round(rnd(3000,9000))),tokOut=Array.from({length:N},()=>Math.round(rnd(1500,5000)));
function renderTok(){tok.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:'#8494b8',fontSize:10},top:0},grid:{left:50,right:12,top:30,bottom:22},xAxis:{type:'category',show:false},yAxis:{type:'value',splitLine:{lineStyle:{color:'#141d33'}},axisLabel:{color:'#8494b8',fontSize:10}},series:[{name:'input tok/min',type:'line',data:tokIn,smooth:true,showSymbol:false,stack:'a',areaStyle:{color:'#4f8cff44'},lineStyle:{color:'#4f8cff',width:1.5}},{name:'output tok/min',type:'line',data:tokOut,smooth:true,showSymbol:false,stack:'a',areaStyle:{color:'#22d3ee44'},lineStyle:{color:'#22d3ee',width:1.5}}]})}
renderTok();
// 延迟
const lat=echarts.init(document.getElementById('c-lat'));
const cats=['kimi-k2','deepseek-v3','qwen-max','gpt-4o'];
lat.setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:'#8494b8',fontSize:10},top:0},grid:{left:44,right:12,top:30,bottom:24},xAxis:{type:'category',data:cats,axisLabel:{color:'#8494b8',fontSize:10}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#141d33'}},axisLabel:{color:'#8494b8',fontSize:10}},series:[{name:'P50',type:'bar',data:[820,640,980,1250],barWidth:12,itemStyle:{color:'#34d399',borderRadius:[3,3,0,0]}},{name:'P95',type:'bar',data:[1850,1420,2240,2680],barWidth:12,itemStyle:{color:'#4f8cff',borderRadius:[3,3,0,0]}},{name:'P99',type:'bar',data:[3100,2480,3600,4150],barWidth:12,itemStyle:{color:'#f472b6',borderRadius:[3,3,0,0]}}]});
// 成本
const cost=echarts.init(document.getElementById('c-cost'));
const D7=['11-05','11-06','11-07','11-08','11-09','11-10','11-11'];
let costV=D7.map(()=>+rnd(120,260).toFixed(1));
cost.setOption({tooltip:{trigger:'axis'},grid:{left:44,right:12,top:16,bottom:24},xAxis:{type:'category',data:D7,axisLabel:{color:'#8494b8',fontSize:10}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#141d33'}},axisLabel:{color:'#8494b8',fontSize:10}},series:[{type:'line',data:costV,smooth:true,symbol:'circle',symbolSize:6,lineStyle:{width:2,color:'#fbbf24'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#fbbf2455'},{offset:1,color:'#fbbf2400'}]}},label:{show:true,color:'#fbbf24',fontSize:10,formatter:'${c}'}}]});
// 模型表
const modelData=[
  ['kimi-k2','m1','38.2%','$96.4'],
  ['deepseek-v3','m2','27.5%','$41.2'],
  ['qwen-max','m3','21.8%','$38.7'],
  ['gpt-4o','m4','12.5%','$43.9'],
];
document.getElementById('models').innerHTML='<tr><th>模型</th><th>调用占比</th><th>成本(7d)</th></tr>'+modelData.map(m=>`<tr><td><span class="model ${m[1]}">${m[0]}</span></td><td>${m[2]}</td><td>${m[3]}</td></tr>`).join('');
// Trace 瀑布
const traces=[
  ['customer-support #8841','意图识别',0,120,'#4f8cff'],['customer-support #8841','检索知识库',120,540,'#22d3ee'],['customer-support #8841','kimi-k2 生成',540,2100,'#34d399'],['customer-support #8841','敏感词校验',2100,120,'#a78bfa'],
  ['data-analyst #1024','SQL 生成',0,860,'#4f8cff'],['data-analyst #1024','duckdb 执行',860,1240,'#fbbf24'],['data-analyst #1024','图表渲染',1240,300,'#22d3ee'],
  ['code-review #5527','代码检索',0,620,'#4f8cff'],['code-review #5527','deepseek-v3 审查',620,1980,'#f472b6'],
  ['crm-agent #330','客户画像加载',0,240,'#4f8cff'],['crm-agent #330','工具调用 ×3',240,960,'#34d399'],['crm-agent #330','qwen-max 总结',960,1320,'#a78bfa'],
];
const tmax=Math.max(...traces.map(t=>t[2]+t[3]));
document.getElementById('traces').innerHTML=traces.map(t=>`<div class="trace-row"><span class="name">${t[0]} · ${t[1]}</span><div class="bar-wrap"><div class="bar" style="left:${t[2]/tmax*100}%;width:${t[3]/tmax*100}%;background:${t[4]}"></div></div><span class="dur">${t[3]}ms</span></div>`).join('');
// KPI
function renderKpis(){
  document.getElementById('kpis').innerHTML=[
    ['今日调用次数','18,462','up','+14.2% 较昨日'],
    ['Token 消耗','2.41','M','up','+9.8%'],
    ['平均延迟 P95','1,842',' ms','dn','-126ms 优化生效'],
    ['今日成本','$'+(costV[costV.length-1]).toFixed(1),'','up','预算内 62%'],
  ].map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div><div class="d ${x[3]}">${x[4]}</div></div>`).join('');
}
renderKpis();
// 实时
setInterval(()=>{
  tokIn.shift();tokIn.push(Math.round(rnd(3000,9000)));
  tokOut.shift();tokOut.push(Math.round(rnd(1500,5000)));renderTok();
  costV[costV.length-1]=+(costV[costV.length-1]+rnd(0.5,3)).toFixed(1);cost.setOption({series:[{data:costV}]});
  renderKpis();
},3000);
window.addEventListener('resize',()=>[tok,lat,cost].forEach(c=>c.resize()));
</script>
</body>
</html>
